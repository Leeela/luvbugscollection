  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff9f0;
      overflow: hidden;
      touch-action: none;
      font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
    }
    canvas { display: block; }

    /* ── Reaction: TWO separate nodes (bubble + fullscreen). Each only toggles
       display:none -> flex (exempt from CLS). No visible node changes geometry
       between the modes, so the crash transition produces zero layout shift. ── */
    #reaction-bubble, #reaction-fullscreen {
      display: none;
      position: fixed; z-index: 10;
      justify-content: center; align-items: center;
    }
    #reaction-bubble.active, #reaction-fullscreen.active { display: flex; }

    /* Bubble: small, top-right corner. Taps pass through to the game. */
    #reaction-bubble {
      top: 12px; right: 12px;
      pointer-events: none;
    }
    #reaction-video {
      aspect-ratio: 9 / 16;
      height: min(22vh, 168px);
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.18);
      background: rgba(255,255,255,0.55);
    }

    /* Fullscreen — only for the sugar-crash / win video (a deliberate pause). */
    #reaction-fullscreen {
      inset: 0; z-index: 11;          /* above the bubble if they coexist */
      background: rgba(255,255,255,0.96);
      pointer-events: auto;
    }
    #reaction-video-fs {
      width: min(50vh, 88vw);
      max-width: 92%; max-height: 92%;
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      background: transparent;
    }

    /* ── Start screen ── */
    #start-screen {
      position: fixed; inset: 0; z-index: 20;
      background: linear-gradient(160deg, #fff8e1 0%, #fce4ec 50%, #e8f5e9 100%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      cursor: pointer; overflow: hidden;
      user-select: none;
    }

    /* Falling candy in the background */
    .bg-candy {
      position: absolute; top: -80px;
      font-size: 48px;
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes fall {
      from { transform: translateY(0) rotate(0deg); opacity: 1; }
      to   { transform: translateY(110vh) rotate(360deg); opacity: 0.6; }
    }

    /* Candy Bug on the start screen */
    #start-bug {
      width: min(42vw, 220px);
      pointer-events: none;
      mix-blend-mode: multiply;
      animation: bounce 1.6s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(0); }
    }

    .start-title {
      font-size: clamp(28px, 7vw, 52px);
      font-weight: 900;
      color: #fff;
      position: relative; z-index: 1;
      text-shadow:
        3px 3px 0 #e91e63,
        -1px -1px 0 #e91e63,
        1px -1px 0 #e91e63,
        -1px 1px 0 #e91e63;
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.15;
      margin: 12px 20px 6px;
    }

    .start-sub {
      font-size: clamp(16px, 3.5vw, 24px);
      color: #5d4037;
      margin-bottom: 24px;
      text-align: center;
      position: relative; z-index: 1;
    }

    .start-stars {
      font-size: clamp(15px, 3.2vw, 22px);
      font-weight: 900;
      color: #f9a825;
      margin-top: 20px;
      text-align: center;
      position: relative; z-index: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }

    .start-btn {
      position: relative; z-index: 1;
      background: linear-gradient(135deg, #66bb6a, #43a047);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px 48px;
      font-size: clamp(20px, 4.5vw, 32px);
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 6px 0 #2e7d32, 0 8px 20px rgba(0,0,0,0.2);
      cursor: pointer;
      animation: pulse 1.2s ease-in-out infinite;
      border: 3px solid rgba(255,255,255,0.4);
    }
    @keyframes pulse {
      0%,100% { transform: scale(1);    box-shadow: 0 6px 0 #2e7d32, 0 8px 20px rgba(0,0,0,0.2); }
      50%      { transform: scale(1.06); box-shadow: 0 4px 0 #2e7d32, 0 6px 24px rgba(0,0,0,0.25); }
    }
    .start-btn { transition: transform 0.1s, opacity 0.1s; }
    .start-btn:active { animation: none; transform: scale(0.97); opacity: 0.85; }
  </style>
