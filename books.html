<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Books – coming soon | Luvbugs Collection</title>
<meta name="description" content="The Luvbugs books are taking a short break. We'll be back with something even better soon.">
<meta name="theme-color" content="#7BC142">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(160deg, #F4FBEF 0%, #E6F5DC 100%);
    color: #333;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(45,134,89,0.15);
    padding: 48px 36px;
    max-width: 460px;
  }
  .emoji { font-size: 64px; line-height: 1; margin-bottom: 16px; }
  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    color: #2D8659;
    font-size: 30px;
    margin-bottom: 14px;
  }
  p { font-size: 17px; line-height: 1.6; color: #555; margin-bottom: 28px; }
  .btn {
    display: inline-block;
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
    background: #7BC142;
    color: #fff;
    text-decoration: none;
    padding: 14px 30px;
    border-radius: 999px;
    font-size: 17px;
    transition: transform .15s ease, background .15s ease;
  }
  .btn:hover { background: #6BB035; transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">📚✨</div>
    <h1>The books are taking a little break</h1>
    <p>We're reworking our books page to make it even better. Check back soon — in the meantime, there's plenty to explore on the home page!</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
