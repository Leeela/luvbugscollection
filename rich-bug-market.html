<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script src="/app-mode.js"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#D4A017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Luv Bugs">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>Rich Bug's Market – Kids Game | Luv Bugs Collection</title>
<meta name="description" content="Help Rich Bug make smart deals! Buy or skip — what's worth your gold coins? Fun learning game for kids ages 4–8.">
<link rel="canonical" href="https://luvbugscollection.com/rich-bug-market.html" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }

:root {
  --safe-top:    env(safe-area-inset-top,    0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left,   0px);
  --safe-right:  env(safe-area-inset-right,  0px);
  --gold:        #D4A017;
  --gold-deep:   #A07A0A;
  --gold-light:  #FEF3C7;
  --gold-mid:    #FDE68A;
}

body {
  font-family: 'Fredoka', sans-serif;
  background: var(--gold-light);
  height: 100dvh;
  overflow: hidden;
  user-select: none;
}

.screen {
  position: fixed; inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
}
.screen.active { display: flex; }

/* ── MENU ── */
#screen-menu {
  justify-content: center;
  gap: clamp(10px, 2.5vmin, 20px);
  background: linear-gradient(160deg, #fffbea 0%, #fef3c7 60%, #fde68a 100%);
}
#menu-bug {
  width: clamp(110px, 28vmin, 200px);
  animation: bob 2.2s ease-in-out infinite;
  filter: drop-shadow(0 8px 18px rgba(160,120,0,0.2));
}
@keyframes bob {
  0%,100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-12px) rotate(2deg); }
}
#screen-menu h1 { font-size: clamp(22px,5.5vmin,42px); color: var(--gold-deep); text-align: center; line-height: 1.2; }
#screen-menu p  { font-size: clamp(14px,3.5vmin,20px); color: #78350f; text-align: center; max-width: 320px; }

.play-btn {
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(18px,4.5vmin,28px);
  font-weight: 700;
  border: none;
  border-radius: 50px;
  padding: clamp(12px,2.5vmin,18px) clamp(36px,8vmin,60px);
  background: linear-gradient(135deg, var(--gold-deep), var(--gold));
  color: #3d1f00;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(160,120,0,0.4);
  transition: transform 0.1s;
}
.play-btn:active { transform: scale(0.95); }

/* ── GAME ── */
#screen-game {
  background: linear-gradient(180deg, #fffbea 0%, var(--gold-light) 100%);
  justify-content: flex-start;
}

.game-header {
  width: 100%;
  background: linear-gradient(135deg, var(--gold-deep), var(--gold));
  padding: clamp(8px,1.5vmin,12px) clamp(14px,3vmin,22px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--gold-deep);
  flex-shrink: 0;
}
.coin-display {
  display: flex; align-items: center; gap: 6px;
  background: rgba(0,0,0,0.15);
  border-radius: 20px;
  padding: 5px 14px;
}
.coin-display span { color: #fff; font-size: clamp(1rem,3vmin,1.4rem); font-weight: 700; }
.round-display { color: #3d1f00; font-size: clamp(0.85rem,2.5vmin,1rem); font-weight: 700; }

.char-row {
  display: flex;
  align-items: flex-end;
  gap: clamp(8px,2vmin,14px);
  padding: clamp(10px,2vmin,16px) clamp(12px,3vmin,20px) clamp(6px,1vmin,10px);
  width: 100%;
  max-width: 500px;
  flex-shrink: 0;
}
.char-img {
  width: clamp(70px,18vmin,110px);
  height: clamp(70px,18vmin,110px);
  object-fit: contain;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 10px rgba(160,120,0,0.3));
}
.char-img.bounce { animation: cbounce 0.5s ease; }
@keyframes cbounce { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-14px)} }
.bubble {
  flex: 1;
  background: #fff;
  border: 2.5px solid var(--gold);
  border-radius: 18px 18px 18px 4px;
  padding: clamp(9px,2vmin,13px) clamp(12px,2.5vmin,16px);
  font-size: clamp(0.85rem,2.5vmin,1rem);
  color: #78350f;
  font-weight: 600;
  line-height: 1.4;
  box-shadow: 0 2px 8px rgba(160,120,0,0.12);
  min-height: clamp(54px,12vmin,72px);
  display: flex;
  align-items: center;
}

.item-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(4px,1vmin,10px) clamp(12px,3vmin,20px);
  width: 100%;
  position: relative;
}
.item-box {
  background: #fffdf0;
  border: 3px solid var(--gold);
  border-radius: 22px;
  padding: clamp(14px,3vmin,22px);
  text-align: center;
  min-width: clamp(130px,35vmin,180px);
  box-shadow: 0 4px 16px rgba(212,160,23,0.2);
}
.item-box.pop { animation: pop 0.35s ease; }
@keyframes pop { 0%{transform:scale(0.65) rotate(-4deg)} 70%{transform:scale(1.06)} 100%{transform:scale(1)} }
.item-emoji { font-size: clamp(3rem,10vmin,5rem); margin-bottom: 4px; display: block; }
.item-name { font-size: clamp(0.9rem,2.5vmin,1.1rem); color: #78350f; font-weight: 700; margin-bottom: 10px; }
.price-tag {
  background: linear-gradient(135deg, var(--gold-deep), var(--gold));
  border-radius: 20px;
  padding: 5px 16px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 6px rgba(160,120,0,0.35);
}
.price-tag span { font-size: clamp(0.85rem,2.5vmin,1rem); font-weight: 800; color: #3d1f00; }

.btn-row {
  display: flex;
  gap: clamp(10px,2.5vmin,16px);
  padding: clamp(6px,1.5vmin,10px) clamp(12px,3vmin,20px);
  width: 100%;
  max-width: 500px;
  flex-shrink: 0;
}
.action-btn {
  flex: 1;
  border: none;
  border-radius: 18px;
  padding: clamp(14px,3.5vmin,20px);
  font-size: clamp(1.1rem,3.5vmin,1.5rem);
  font-weight: 800;
  cursor: pointer;
  font-family: 'Fredoka', sans-serif;
  transition: transform 0.1s;
}
.action-btn:active { transform: scale(0.93); }
.btn-yes { background: linear-gradient(135deg,#16a34a,#22c55e); color:#fff; box-shadow:0 4px 14px rgba(22,163,74,0.4); }
.btn-no  { background: linear-gradient(135deg,#dc2626,#ef4444); color:#fff; box-shadow:0 4px 14px rgba(220,38,38,0.35); }
.action-btn:disabled { opacity: 0.5; cursor: default; }

.feedback {
  width: 100%;
  padding: clamp(9px,2vmin,13px) clamp(14px,3vmin,20px);
  text-align: center;
  font-size: clamp(0.82rem,2.3vmin,0.95rem);
  font-weight: 700;
  flex-shrink: 0;
  min-height: clamp(40px,9vmin,52px);
  display: flex;
  align-items: center;
  justify-content: center;
  border-top: 2px solid var(--gold);
  transition: background 0.3s;
}
.feedback.good    { background: linear-gradient(135deg,#d1fae5,#a7f3d0); color:#065f46; }
.feedback.bad     { background: linear-gradient(135deg,#fee2e2,#fecaca); color:#991b1b; }
.feedback.neutral { background: linear-gradient(135deg,var(--gold-mid),var(--gold-light)); color:#78350f; }

.dots { display:flex; gap:6px; padding:clamp(4px,1vmin,8px) 0; flex-shrink:0; }
.dot  { width:10px;height:10px;border-radius:50%;background:var(--gold);opacity:0.3;transition:opacity 0.3s; }
.dot.done { opacity:1; }

/* ── END ── */
#screen-end {
  justify-content: center;
  gap: clamp(10px,2.5vmin,18px);
  background: linear-gradient(160deg,#fffbea 0%,#fef3c7 60%,#fde68a 100%);
  text-align: center;
  padding-left: clamp(16px,4vmin,32px);
  padding-right: clamp(16px,4vmin,32px);
}
#end-emoji { font-size: clamp(4rem,12vmin,7rem); }
#end-title { font-size: clamp(1.6rem,5vmin,3rem); color: var(--gold-deep); }
#end-msg   { font-size: clamp(1rem,3vmin,1.4rem); color:#78350f; }
#end-bug   { width:clamp(80px,20vmin,140px); filter:drop-shadow(0 6px 14px rgba(160,120,0,0.2)); }

/* ── TREASURE PILE ── */
.char-stack { display:flex; flex-direction:column; align-items:center; gap:2px; flex-shrink:0; }
.coin-pile { width:clamp(72px,18vmin,112px); height:clamp(42px,10vmin,60px); position:relative; }
.coin-pile svg { width:100%; height:100%; overflow:visible; transform-origin:50% 82%; }
.coin-pile svg.grow   { animation:pileGrow 0.5s ease; }
.coin-pile svg.shrink { animation:pileShrink 0.5s ease; }
@keyframes pileGrow   { 0%,100%{transform:scale(1)} 45%{transform:scale(1.13)} }
@keyframes pileShrink { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
.float-coin { position:absolute; left:50%; top:0; transform:translateX(-50%); font-weight:800; font-size:clamp(0.9rem,3vmin,1.25rem); pointer-events:none; opacity:0; text-shadow:0 1px 2px rgba(255,255,255,0.8); }
.float-heart { position:absolute; bottom:10%; font-size:clamp(1.4rem,5vmin,2.2rem); pointer-events:none; opacity:0; animation:heartUp 1.3s ease-out forwards; }
@keyframes heartUp { 0%{opacity:0; transform:translateY(10px) scale(0.6)} 20%{opacity:1} 100%{opacity:0; transform:translateY(-90px) scale(1.1)} }
.float-coin.go   { animation:floatUp   1.1s ease forwards; }
.float-coin.lose { animation:floatDown 1.1s ease forwards; }
@keyframes floatUp   { 0%{opacity:0;transform:translate(-50%,8px)} 20%{opacity:1} 100%{opacity:0;transform:translate(-50%,-30px)} }
@keyframes floatDown { 0%{opacity:0;transform:translate(-50%,-8px)} 20%{opacity:1} 100%{opacity:0;transform:translate(-50%,30px)} }

/* ── MYSTERY BOX ── */
.mystery-row { display:flex; gap:clamp(12px,3vmin,20px); justify-content:center; align-items:stretch; width:100%; }
.mystery-box { flex:1; max-width:clamp(120px,34vmin,160px); border:3px solid var(--gold); border-radius:22px; padding:clamp(12px,3vmin,20px) clamp(8px,2vmin,14px); background:#fffdf0; cursor:pointer; text-align:center; transition:transform 0.12s; position:relative; font-family:'Fredoka',sans-serif; }
.mystery-box:active { transform:scale(0.94); }
.mystery-box .mbox-emoji { font-size:clamp(2.6rem,9vmin,4.2rem); display:block; }
.mystery-box .mbox-label { font-size:clamp(0.8rem,2.4vmin,1rem); font-weight:700; color:#78350f; margin-top:4px; }
.mystery-box.shiny { animation:shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 0%,100%{box-shadow:0 0 0 rgba(212,160,23,0)} 50%{box-shadow:0 0 20px rgba(212,160,23,0.8)} }
.mystery-box.dusty { background:#ece9e4; border-color:#b9b4a9; filter:grayscale(0.35); }
.mbox-tag { position:absolute; top:6px; right:9px; font-size:clamp(0.9rem,2.6vmin,1.15rem); }
.mystery-box.opened { animation:pop 0.35s ease; }
.mystery-box:disabled { cursor:default; }
</style>
</head>
<body>

<!-- MENU -->
<div class="screen active" id="screen-menu">
  <img src="/bilder/rikedomsbacillen.png" id="menu-bug" alt="Rich Bug">
  <h1>Rich Bug's<br>Market 🏪</h1>
  <p>Smart deal or waste of gold coins? You decide!</p>
  <button class="play-btn" onclick="startGame()">🟡 Play!</button>
  <a href="/app/games.html" style="display:inline-block;margin-top:14px;font-family:'Fredoka',sans-serif;font-size:clamp(14px,3vmin,18px);color:var(--gold-deep);text-decoration:none;font-weight:600;">🎮 More games</a>
</div>

<!-- GAME -->
<div class="screen" id="screen-game">
  <div class="game-header">
    <span style="color:#3d1f00;font-weight:700;font-size:clamp(0.85rem,2.5vmin,1rem);">💰 Your coins</span>
    <div class="coin-display">
      <span>🟡</span>
      <span id="coinCount">15</span>
    </div>
    <div class="round-display" id="roundDisplay">Round 1/8</div>
  </div>

  <div class="char-row">
    <div class="char-stack">
      <img src="/bilder/rikedomsbacillen.png" class="char-img" id="charImg" alt="Rich Bug">
      <div class="coin-pile" id="coinPile"></div>
    </div>
    <div class="bubble" id="bubble">Welcome to the market! 🤑</div>
  </div>

  <div class="item-area">
    <div class="item-box" id="itemBox">
      <span class="item-emoji" id="itemEmoji">🎁</span>
      <div class="item-name" id="itemName">Loading…</div>
      <div class="price-tag">
        <span>🟡</span>
        <span id="itemPrice">—</span>
      </div>
    </div>
    <div class="mystery-row" id="mysteryArea" style="display:none;">
      <button class="mystery-box" id="mboxL" onclick="pickMystery('L')">
        <span class="mbox-tag" id="tagL"></span>
        <span class="mbox-emoji" id="emojiL">📦</span>
        <span class="mbox-label" id="labelL">?</span>
      </button>
      <button class="mystery-box" id="mboxR" onclick="pickMystery('R')">
        <span class="mbox-tag" id="tagR"></span>
        <span class="mbox-emoji" id="emojiR">📦</span>
        <span class="mbox-label" id="labelR">?</span>
      </button>
    </div>
  </div>

  <div class="btn-row" id="btnRow">
    <button class="action-btn btn-yes" id="btnYes" onclick="answer(true)">✅ YES!</button>
    <button class="action-btn btn-no"  id="btnNo"  onclick="answer(false)">❌ NO!</button>
  </div>

  <div class="dots" id="dots"></div>
  <div class="feedback neutral" id="feedback">Is it worth your gold coins?</div>
</div>

<!-- END -->
<div class="screen" id="screen-end">
  <div id="end-emoji">🎉</div>
  <h1 id="end-title">Great job!</h1>
  <p id="end-msg">You made it through the market!</p>
  <img src="/bilder/rikedomsbacillen.png" id="end-bug" alt="Rich Bug">
  <button class="play-btn" onclick="startGame()">🔄 Play again</button>
  <a href="/app/games.html" style="font-family:'Fredoka',sans-serif;font-size:clamp(14px,3vmin,18px);color:var(--gold-deep);text-decoration:none;font-weight:600;">← Back to games</a>
</div>

<script>
const ITEMS = [
  { emoji:'🏠', name:'House',            price:12, worth:28, valuable:true  },
  { emoji:'👟', name:'Old shoe',         price:5,  worth:0,  valuable:false },
  { emoji:'⌚', name:'Gold watch',       price:10, worth:22, valuable:true, gold:true },
  { emoji:'🧦', name:'Torn sock',        price:4,  worth:0,  valuable:false },
  { emoji:'🍬', name:'Bag of candy',     price:5,  worth:0,  valuable:false },
  { emoji:'🗑️', name:'Empty bin',       price:3,  worth:0,  valuable:false },
  { emoji:'🏆', name:'Gold trophy',      price:7,  worth:15, valuable:true  },
  { emoji:'🌂', name:'Broken umbrella',  price:4,  worth:0,  valuable:false },
  { emoji:'🪙', name:'Silver coin',      price:5,  worth:0,  valuable:false },
  { emoji:'📦', name:'Empty box',        price:3,  worth:0,  valuable:false },
  { emoji:'🥕', name:'Carrot',           price:2,  worth:7,  valuable:true  },
  { emoji:'🧸', name:'Fancy stuffed toy',price:10, worth:0,  valuable:false },
  { emoji:'📚', name:'Book',             price:4,  worth:11, valuable:true  },
  { emoji:'🚗', name:'Expensive toy car',price:9,  worth:0,  valuable:false },
  { emoji:'🎁', name:'Mystery gift',     price:6,  worth:14, valuable:true  },

  /* More valuables (good deals) */
  { emoji:'💎', name:'Diamond',          price:11, worth:30, valuable:true  },
  { emoji:'💍', name:'Gold ring',        price:9,  worth:20, valuable:true, gold:true },
  { emoji:'🥇', name:'Gold medal',       price:6,  worth:16, valuable:true, gold:true },
  { emoji:'👑', name:'Sparkly crown',    price:12, worth:26, valuable:true, gold:true },
  { emoji:'🖼️', name:'Fine painting',    price:8,  worth:19, valuable:true  },
  { emoji:'💰', name:'Treasure chest',   price:10, worth:24, valuable:true, gold:true },

  /* More useless toys/junk (bad buys) */
  { emoji:'🪀', name:'Broken yo-yo',     price:5,  worth:0,  valuable:false },
  { emoji:'🎈', name:'Popped balloon',   price:4,  worth:0,  valuable:false },
  { emoji:'🤖', name:'Broken robot',     price:8,  worth:0,  valuable:false },
  { emoji:'🪁', name:'Ripped kite',      price:6,  worth:0,  valuable:false },
  { emoji:'🛼', name:'Broken roller skate', price:7, worth:0, valuable:false },
  { emoji:'🦖', name:'Plastic dinosaur', price:9,  worth:0,  valuable:false },

  /* Treats to enjoy — ONE is fine (💖), but several is too much */
  { emoji:'🍦', name:'Ice cream',        price:3,  worth:0,  treat:true },
  { emoji:'🍟', name:'Chips',            price:3,  worth:0,  treat:true },
  { emoji:'🥤', name:'Soda',             price:3,  worth:0,  treat:true },
  { emoji:'🍭', name:'Lollipop',         price:2,  worth:0,  treat:true },
  { emoji:'🧁', name:'Cupcake',          price:4,  worth:0,  treat:true },
  { emoji:'🍫', name:'Chocolate',        price:3,  worth:0,  treat:true },
];

const BUBBLES_OFFER  = ['Want to buy {an} {name} for {price} coins? 🤔','Look what I found! {An} {name} for just {price} coins! 🤑','Special offer! {name} — price: {price} coins. Deal? 😏'];
function article(name, cap) { const a = /^[aeiou]/i.test(name) ? 'an' : 'a'; return cap ? a.charAt(0).toUpperCase() + a.slice(1) : a; }
const BUBBLES_GOOD   = ['Wonderful! That was a great deal! 🤑','Smart move! You earned coins on that purchase! 🥳','Exactly right! Wealth comes from wise choices! 🏆'];
const BUBBLES_WASTE  = ['Hmm… that wasn\'t my best deal! 😅','Oops! Bad buys cost coins! 💸','Next time — think a little more! 🤔'];
const BUBBLES_SMART  = ['Clever! You didn\'t waste your coins! 👏','Smart! Not everything shiny is gold! ✨','Exactly! Save your coins for better deals! 💰'];
const BUBBLES_MISSED = ['You missed a good deal! But it happens! 😮','Sometimes we miss out — but you\'re still in the game! 🙂','That was worth a lot — but you\'ll manage! 💪'];
const BUBBLES_TREAT_JOY  = ['Yum! Treating yourself sometimes makes you happy! 💖','Lovely! A little treat makes life more fun! 🥰','A small treat — it\'s okay to be kind to yourself! 😋'];
const BUBBLES_TREAT_MUCH = ['Whoa! Too many treats at once! 😵','Oops! All at once is too much! 🤢','Just enough is best — one treat is plenty! 😅'];
const BUBBLES_TREAT_SKIP = ['Wisely saved — but feel free to treat yourself sometimes! 😊','It\'s okay to wait too! 👍','You kept your coins — treat yourself another time! 💛'];

const TOTAL = 8;
const MYS_WIN = 8, MYS_LOSS = 5;
let coins = 15, round = 0, order = [], waiting = true, treatsBought = 0;
let mysteryRound = -1, mysteryDone = false, winnerSide = 'L';

function playCoinSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [1046, 1318, 1568].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.09;
      gain.gain.setValueAtTime(0.28, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      osc.start(t);
      osc.stop(t + 0.45);
    });
  } catch(e) {}
}

function playVoice(name) {
  try {
    const audio = new Audio('/ljud/' + name + '.mp3');
    audio.play().catch(() => {});
  } catch(e) {}
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  coins = 15; round = 0; treatsBought = 0;
  order = shuffle(ITEMS).slice(0, TOTAL);
  mysteryRound = 1 + Math.floor(Math.random() * (TOTAL - 1));
  mysteryDone = false;
  buildDots();
  renderPile(coins);
  show('screen-game');
  nextRound();
}

function renderPile(n) {
  const cap = [5,4,3,2,1,1];
  const drawn = Math.max(0, Math.min(n, 16));
  const coinR = 8, dx = 17, dy = 12, baseY = 66, cx = 60;
  let circles = '', remaining = drawn;
  const bottomCount = Math.min(remaining, cap[0]);
  for (let i = 0; i < cap.length && remaining > 0; i++) {
    const k = Math.min(remaining, cap[i]);
    const y = baseY - i * dy;
    const startX = cx - ((k - 1) * dx) / 2;
    for (let j = 0; j < k; j++) {
      const x = startX + j * dx;
      const fill = (i + j) % 2 === 0 ? '#D4A017' : '#FDE68A';
      circles += `<circle cx="${x}" cy="${y}" r="${coinR}" fill="${fill}" stroke="#A07A0A" stroke-width="1.5"/>`;
    }
    remaining -= k;
  }
  const shadowW = Math.max(12, bottomCount * 9);
  const shadow = `<ellipse cx="${cx}" cy="${baseY + 9}" rx="${shadowW}" ry="6" fill="#A07A0A" opacity="0.22"/>`;
  document.getElementById('coinPile').innerHTML =
    `<svg viewBox="0 0 120 84" role="img" aria-label="Treasure pile with ${n} coins">${shadow}${circles}</svg>`;
}

function animatePile(gain) {
  const svg = document.querySelector('#coinPile svg');
  if (!svg) return;
  svg.classList.remove('grow','shrink');
  void svg.offsetWidth;
  svg.classList.add(gain ? 'grow' : 'shrink');
}

function floatCoin(text, gain) {
  const pile = document.getElementById('coinPile');
  const el = document.createElement('div');
  el.className = 'float-coin ' + (gain ? 'go' : 'lose');
  el.style.color = gain ? '#16a34a' : '#dc2626';
  el.textContent = text;
  pile.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function floatHearts() {
  const area = document.querySelector('.item-area') || document.getElementById('itemBox');
  if (!area) return;
  const hearts = ['💖','💕','💗','😋','🥰'];
  for (let i = 0; i < 5; i++) {
    const el = document.createElement('div');
    el.className = 'float-heart';
    el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    el.style.left = (25 + Math.random() * 50) + '%';
    el.style.animationDelay = (i * 0.12) + 's';
    area.appendChild(el);
    setTimeout(() => el.remove(), 1600 + i * 120);
  }
}

function bounceChar() {
  const img = document.getElementById('charImg');
  img.classList.remove('bounce');
  void img.offsetWidth;
  img.classList.add('bounce');
}

function buildDots() {
  const d = document.getElementById('dots');
  d.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const el = document.createElement('div');
    el.className = 'dot';
    el.id = 'dot'+i;
    d.appendChild(el);
  }
}

function nextRound() {
  if (round >= TOTAL || coins <= 0) { endGame(); return; }
  document.getElementById('roundDisplay').textContent = `Round ${round+1}/${TOTAL}`;
  document.getElementById('coinCount').textContent = coins;
  renderPile(coins);

  if (round === mysteryRound && !mysteryDone) { startMysteryRound(); return; }

  document.getElementById('itemBox').style.display = '';
  document.getElementById('mysteryArea').style.display = 'none';
  document.getElementById('btnRow').style.display = 'flex';

  waiting = false;
  const item = order[round];
  const emojiEl = document.getElementById('itemEmoji');
  emojiEl.textContent = item.emoji;
  emojiEl.style.filter = item.gold ? 'sepia(1) saturate(6) hue-rotate(5deg) brightness(1.1)' : '';
  document.getElementById('itemName').textContent = item.name;
  document.getElementById('itemPrice').textContent = item.price + ' coins';
  const offerText = pick(BUBBLES_OFFER).replace('{an}', article(item.name, false)).replace('{An}', article(item.name, true)).replace('{name}', item.name).replace('{price}', item.price);
  document.getElementById('bubble').textContent = offerText;
  document.getElementById('feedback').className = 'feedback neutral';
  document.getElementById('feedback').textContent = 'Is it worth your gold coins?';
  document.getElementById('coinCount').textContent = coins;
  const box = document.getElementById('itemBox');
  box.classList.remove('pop');
  void box.offsetWidth;
  box.classList.add('pop');
  document.getElementById('btnYes').disabled = false;
  document.getElementById('btnNo').disabled = false;
}

function answer(bought) {
  if (waiting) return;
  waiting = true;
  document.getElementById('btnYes').disabled = true;
  document.getElementById('btnNo').disabled = true;

  const item = order[round];
  const fb = document.getElementById('feedback');
  const img = document.getElementById('charImg');
  img.classList.remove('bounce');
  void img.offsetWidth;
  img.classList.add('bounce');

  if (item.treat) {
    if (bought) {
      treatsBought++;
      if (treatsBought === 1) {
        // First treat — it's okay to enjoy! Hearts, no coins lost.
        fb.className = 'feedback good';
        fb.textContent = `💖 Yum! A little ${item.name.toLowerCase()} makes you happy — and you kept all your coins!`;
        document.getElementById('bubble').textContent = pick(BUBBLES_TREAT_JOY);
        floatHearts();
        playVoice('wow');
        playCoinSound();
      } else {
        // Several treats in one game — too much, bad deal.
        coins -= item.price;
        fb.className = 'feedback bad';
        fb.textContent = `😬 Oops! Too many treats at once — ${item.name} cost you ${item.price} coins!`;
        document.getElementById('bubble').textContent = pick(BUBBLES_TREAT_MUCH);
        renderPile(coins); animatePile(false); floatCoin('-' + item.price, false);
      }
    } else {
      // Skipped a treat — always fine.
      fb.className = 'feedback neutral';
      fb.textContent = `👍 It's okay to save too! You can treat yourself to ${item.name.toLowerCase()} another time.`;
      document.getElementById('bubble').textContent = pick(BUBBLES_TREAT_SKIP);
    }
  } else if (bought) {
    if (item.valuable) {
      const gain = item.worth - item.price;
      coins += gain;
      fb.className = 'feedback good';
      fb.textContent = `🎉 Great deal! ${item.name} is worth 🟡${item.worth} — you earned ${gain} coins!`;
      document.getElementById('bubble').textContent = pick(BUBBLES_GOOD);
      renderPile(coins); animatePile(true); floatCoin('+' + gain, true);
      playVoice('wow');
      playCoinSound();
    } else {
      coins -= item.price;
      fb.className = 'feedback bad';
      fb.textContent = `😬 Oops! ${item.name} was worth nothing — you lost ${item.price} coins!`;
      document.getElementById('bubble').textContent = pick(BUBBLES_WASTE);
      renderPile(coins); animatePile(false); floatCoin('-' + item.price, false);
    }
  } else {
    if (item.valuable) {
      fb.className = 'feedback neutral';
      fb.textContent = `💭 You missed a good deal! ${item.name} was worth 🟡${item.worth}.`;
      document.getElementById('bubble').textContent = pick(BUBBLES_MISSED);
    } else {
      fb.className = 'feedback good';
      fb.textContent = `✅ Smart! ${item.name} wasn't worth a single coin. Good call!`;
      document.getElementById('bubble').textContent = pick(BUBBLES_SMART);
      playVoice('smart');
      playCoinSound();
    }
  }

  document.getElementById('coinCount').textContent = coins;
  document.getElementById('dot'+round).classList.add('done');
  round++;
  setTimeout(nextRound, 2300);
}

function startMysteryRound() {
  waiting = false;
  document.getElementById('itemBox').style.display = 'none';
  document.getElementById('mysteryArea').style.display = 'flex';
  document.getElementById('btnRow').style.display = 'none';
  document.getElementById('feedback').className = 'feedback neutral';
  document.getElementById('feedback').textContent = 'Tap a box — but choose wisely! 👀';
  document.getElementById('bubble').textContent = 'One box hides treasure — the other is junk! Which do you dare open? 😏';

  winnerSide = Math.random() < 0.5 ? 'L' : 'R';
  const loserSide = winnerSide === 'L' ? 'R' : 'L';
  ['L','R'].forEach(s => {
    const box = document.getElementById('mbox' + s);
    box.disabled = false;
    box.classList.remove('opened','shiny','dusty');
    document.getElementById('emoji' + s).textContent = '📦';
    document.getElementById('label' + s).textContent = '?';
    document.getElementById('tag' + s).textContent = '';
  });
  document.getElementById('mbox' + winnerSide).classList.add('shiny');
  document.getElementById('tag' + winnerSide).textContent = '✨';
  document.getElementById('mbox' + loserSide).classList.add('dusty');
  document.getElementById('tag' + loserSide).textContent = '🕸️';
}

function pickMystery(side) {
  if (waiting) return;
  waiting = true;
  mysteryDone = true;
  document.getElementById('mboxL').disabled = true;
  document.getElementById('mboxR').disabled = true;

  const win = side === winnerSide;
  const loserSide = winnerSide === 'L' ? 'R' : 'L';
  document.getElementById('emoji' + winnerSide).textContent = '💎';
  document.getElementById('label' + winnerSide).textContent = 'Treasure!';
  document.getElementById('emoji' + loserSide).textContent = '🕸️';
  document.getElementById('label' + loserSide).textContent = 'Junk';
  document.getElementById('mbox' + side).classList.add('opened');

  const fb = document.getElementById('feedback');
  bounceChar();
  if (win) {
    coins += MYS_WIN;
    fb.className = 'feedback good';
    fb.textContent = `🎉 You picked the shiny box — treasure! +${MYS_WIN} coins! 💎`;
    document.getElementById('bubble').textContent = 'You looked at the clues! Smart move! 🤑';
    renderPile(coins); animatePile(true); floatCoin('+' + MYS_WIN, true);
    playVoice('wow');
    playCoinSound();
  } else {
    coins -= MYS_LOSS;
    fb.className = 'feedback bad';
    fb.textContent = `😬 Oops! The dusty box was junk — you lost ${MYS_LOSS} coins. Never buy blindly! 💡`;
    document.getElementById('bubble').textContent = 'Look at the clues next time — the shiny one was the treasure! 💡';
    renderPile(coins); animatePile(false); floatCoin('-' + MYS_LOSS, false);
  }

  document.getElementById('coinCount').textContent = coins;
  document.getElementById('dot' + round).classList.add('done');
  round++;
  setTimeout(() => {
    document.getElementById('mysteryArea').style.display = 'none';
    document.getElementById('itemBox').style.display = '';
    document.getElementById('btnRow').style.display = 'flex';
    nextRound();
  }, 2800);
}

function endGame() {
  show('screen-end');
  let emoji, title, msg;
  if (coins <= 0) {
    emoji = '😢'; title = 'No coins left!';
    msg = 'Rich Bug wants to train you more. Try again!';
  } else if (coins > 25) {
    emoji = '🏆'; title = 'Master Trader!';
    msg = `You ended with 🟡${coins} coins — fantastic!`;
  } else {
    emoji = '🎉'; title = 'Great job!';
    msg = `You ended with 🟡${coins} coins!`;
  }
  document.getElementById('end-emoji').textContent = emoji;
  document.getElementById('end-title').textContent = title;
  document.getElementById('end-msg').textContent = msg;
}
</script>
