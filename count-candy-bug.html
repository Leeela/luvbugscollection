  --safe-left:   env(safe-area-inset-left,   0px);

/* Confetti on success */

<script>
/* ── Constants ── */
const ROUNDS_TO_END = 10;        // correct answers before the doctor animation
const CANDY_EMOJI = ['🍬','🍭','🍫','🧁','🍩','🍪'];
const NUM_EN = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen'];
const PRAISE = ['Good job!', 'Great!', 'Yes!'];  // fallback text, matches the praise clips
const CONF_COLORS = ['#7BC142','#FFCC4D','#FF8FB1','#5BC0F0','#C792EA','#FF8A65'];

/* ── Helpers ── */
const $ = id => document.getElementById(id);
function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

/* ── Sound ── */
const SFX = {
  wow:   new Audio('/ljud/wow.mp3'),
};
function playSfx(key, vol) {
  try { const a = SFX[key].cloneNode(); a.volume = vol == null ? 1 : vol; a.play().catch(()=>{}); } catch(e) {}
}

let audioCtx = null;
function ensureCtx() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// CHOMP – a short, soft "nom" synthesized in the browser (no sound file needed)
function chompSound() {
  try {
    const ctx = ensureCtx();
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(190, t);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.13);   // downward sweep = "nom"
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.20, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.18);
  } catch (e) {}
}
// Ding on reaching the number – a soft rising chime
function dingSound() {
  try {
    const ctx = ensureCtx();
    const t = ctx.currentTime;
    [{ f: 784, d: 0 }, { f: 1047, d: 0.10 }, { f: 1319, d: 0.20 }].forEach(n => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = n.f;
      const s = t + n.d;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.20, s + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.40);
      o.connect(g); g.connect(ctx.destination);
      o.start(s); o.stop(s + 0.45);
    });
  } catch (e) {}
}
// Count out loud in English (browser voice – used as fallback). Pick a clear
// English voice and avoid the robotic default; fall back to any en voice.
const VOICE_PREFS = ['Samantha', 'Karen', 'Moira', 'Tessa', 'Daniel', 'Shelley', 'Sandy'];
let _enVoice = null;
function pickEnVoice() {
  try {
    if (!('speechSynthesis' in window)) return null;
    const vs = speechSynthesis.getVoices() || [];
    for (const name of VOICE_PREFS) {
      const v = vs.find(v => v.name === name || v.name.startsWith(name + ' '));
      if (v) return v;
    }
    return vs.find(v => /^en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch (e) { return null; }
}
try { if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { _enVoice = pickEnVoice(); }; } catch (e) {}
function speak(text, pitch) {
  try {
    if (!('speechSynthesis' in window)) return;
    if (!_enVoice) _enVoice = pickEnVoice();
    const u = new SpeechSynthesisUtterance(text);
    if (_enVoice) u.voice = _enVoice;
    u.lang = (_enVoice && _enVoice.lang) || 'en-US';
    u.rate = 0.95; u.pitch = pitch == null ? 1.25 : pitch;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

/* ── Recorded Candy Bug voice (ElevenLabs) with TTS fallback ──
   Clips live in /ljud/rost/en/. If a clip is missing the browser voice is
   used automatically – the game works without the clips. */
const VOICE_DIR = '/ljud/rost/en/';
// Key → Leila's ElevenLabs filename.
const VOICE_FILES = {
  '1': 'One.mp3', '2': 'two.mp3', '3': 'three.mp3', '4': 'four.mp3', '5': 'five.mp3',
  '6': 'Six.mp3', '7': 'seven.mp3', '8': 'eight.mp3', '9': 'nine.mp3', '10': 'ten.mp3',
  'plus': 'plus.mp3', 'lika': 'equals.mp3',
  'berom1': 'Good_job_.mp3', 'berom2': 'Great_.mp3', 'berom3': 'Yes_.mp3'
};
const PRAISE_KEYS = ['berom1', 'berom2', 'berom3']; // same order as PRAISE
const VOICE_KEYS = Object.keys(VOICE_FILES);
const voiceEls = {};
VOICE_KEYS.forEach(k => {
  try { const a = new Audio(VOICE_DIR + VOICE_FILES[k]); a.preload = 'auto'; voiceEls[k] = a; } catch (e) {}
});
// A clip counts as ready if metadata has loaded (readyState >= 1) and no 404 error.
// iOS Safari only reaches readyState=1 after warmVoices; requiring >=2 caused iPad
// to always fall back to TTS.
function clipReady(k) {
  const a = voiceEls[k];
  return !!a && !a.error && a.readyState >= 1 && isFinite(a.duration) && a.duration > 0;
}
// Stop everything currently playing (clips + TTS) so nothing overlaps
let voiceActive = [];
function stopVoice() {
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  voiceActive.forEach(a => { try { a.pause(); } catch (e) {} });
  voiceActive = [];
}
// Play a sequence of clips back-to-back; interrupts anything already playing.
// Falls back to TTS if any clip is missing.
const CLIP_GAP = 0.5;             // sec – clear pause between clips so words don't blur together
function sayClips(keys, ttsFallback, onDone) {
  stopVoice();
  if (!keys.every(clipReady)) {
    speak(ttsFallback);
    // Calculate TTS duration — 70ms per character + 800ms margin.
    // Prevents onDone firing mid-sentence (old 1600ms hardcode wasn't enough
    // for "three plus two equals five! Great!" which takes ~3–4 sec).
    if (onDone) setTimeout(onDone, Math.max(2500, ttsFallback.length * 70 + 800));
    return;
  }
  let i = 0;
  (function playNext() {
    if (i >= keys.length) { if (onDone) onDone(); return; }
    const key = keys[i++];
    const a = voiceEls[key];
    if (!a) { if (onDone) onDone(); return; }
    const dur = a.duration || 0.6;
    // Play the ORIGINAL element (NOT a clone). iOS only unlocks elements warmed in a
    // gesture (warmVoices) – fresh clones are silent/intermittent on iPhone. Originals
    // can be replayed anytime once unlocked.
    try { a.pause(); a.currentTime = 0; } catch (e) {}
    voiceActive.push(a);
    let stepped = false;
    // Wait CLIP_GAP sec after the clip goes silent before the next word → clear pause
    const step = () => { if (stepped) return; stepped = true; setTimeout(playNext, CLIP_GAP * 1000); };
    // Failsafe if 'ended' never fires (e.g. iOS): clip length + small margin
    const t = setTimeout(step, (dur + 0.25) * 1000);
    a.addEventListener('ended', () => { clearTimeout(t); step(); }, { once: true });
    a.addEventListener('error', () => { clearTimeout(t); step(); }, { once: true });
    const p = a.play(); if (p) p.catch(() => { clearTimeout(t); step(); });
  })();
}
// Say a single number (1–10)
function sayNumber(n) { sayClips([String(n)], NUM_EN[n] || String(n)); }

/* ── Chew pulse on the loop video for every feed ── */
function chompMouth() {
  const bug = $('bug');
  bug.classList.remove('chomp'); void bug.offsetWidth; bug.classList.add('chomp');
}

/* ── Game logic ── */
let level = 1;
let stars = 0;
let target = 0;
let eaten = 0;
let locked = false;
let addA = 0, addB = 0;          // the two numbers in the plus task (level 3)
let endTimer = null;             // failsafe timer for the end-screen buttons

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function startGame(lvl) {
  level = lvl;
  stars = 0;
  $('hud-right').textContent = '⭐ 0';
  $('hud-center').textContent = level === 3 ? 'Work it out and fill the boxes!' : 'Drag candy to the boxes!';
  show('screen-game');
  nextRound();
}

function nextRound() {
  locked = false;
  eaten = 0;
  $('bug').classList.remove('cheer', 'chomp');

  // Decide the number
  let display, extra;
  if (level === 1) {
    target = randInt(1, 5);
    display = String(target);
    extra = 0;                       // exact amount – crystal clear for the youngest
  } else if (level === 2) {
    target = randInt(1, 10);
    display = String(target);
    extra = randInt(2, 3);           // a few extra candies in the pile
  } else {
    let a = randInt(1, 5), b = randInt(1, 5);
    while (a + b > 10) { a = randInt(1, 5); b = randInt(1, 5); }
    target = a + b;
    addA = a; addB = b;
    display = a + ' + ' + b;
    extra = 0;                       // exactly as many candies as the answer (4+4 → 8 candies)
  }

  // Number display
  const num = $('number');
  num.textContent = display;
  num.classList.remove('equation');
  num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');

  // Counter
  $('counter-target').textContent = target;
  updateCounter();

  // Empty boxes to fill
  const slots = $('slots');
  slots.style.opacity = '';
  slots.innerHTML = '';
  slots.classList.toggle('big', level === 1);   // bigger boxes on Easy (easier to hit)
  if (level === 3) {
    // Two groups of boxes matching the numbers: addA boxes «+» addB boxes.
    // The child SEES the addition (4+4) – not just the total.
    const g1 = document.createElement('div'); g1.className = 'slot-group';
    for (let i = 0; i < addA; i++) g1.appendChild(makeSlot());
    const plus = document.createElement('div'); plus.className = 'plus-sign'; plus.textContent = '+';
    const g2 = document.createElement('div'); g2.className = 'slot-group';
    for (let i = 0; i < addB; i++) g2.appendChild(makeSlot());
    slots.appendChild(g1); slots.appendChild(plus); slots.appendChild(g2);
  } else {
    for (let i = 0; i < target; i++) slots.appendChild(makeSlot());
  }

  // Candy pile to drag from (a few more than the boxes → looks like a pile)
  const tray = $('tray');
  tray.innerHTML = '';
  tray.classList.toggle('big', level === 1);    // bigger candies on Easy
  const supply = target + extra;
  for (let i = 0; i < supply; i++) tray.appendChild(makeCandy());
}

function makeSlot() {
  const s = document.createElement('div');
  s.className = 'slot';
  return s;
}
function makeCandy() {
  const b = document.createElement('div');
  b.className = 'candy';
  b.textContent = pick(CANDY_EMOJI);
  b.addEventListener('pointerdown', e => startDrag(e, b));
  return b;
}

function updateCounter() {
  $('counter-eaten').textContent = eaten;
}

/* ── Drag a candy to a box (works with finger + mouse) ── */
let drag = null;
function startDrag(e, candyEl) {
  if (locked || drag) return;
  e.preventDefault();
  warmVoices();                       // unlock audio inside the user gesture
  const r = candyEl.getBoundingClientRect();
  const ghost = candyEl.cloneNode(true);
  ghost.classList.add('dragging-ghost');
  ghost.style.position = 'fixed';
  ghost.style.margin = '0';
  ghost.style.width = r.width + 'px';
  ghost.style.height = r.height + 'px';
  ghost.style.left = r.left + 'px';
  ghost.style.top = r.top + 'px';
  ghost.style.display = 'flex';
  ghost.style.alignItems = 'center';
  ghost.style.justifyContent = 'center';
  document.body.appendChild(ghost);
  candyEl.classList.add('grabbed');
  drag = { candyEl, ghost, w: r.width, h: r.height,
           dx: e.clientX - r.left, dy: e.clientY - r.top };
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragEnd);
}
function onDragMove(e) {
  if (!drag) return;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top  = (e.clientY - drag.dy) + 'px';
  const slot = slotUnder(e.clientX, e.clientY);
  document.querySelectorAll('.slot.hover').forEach(s => { if (s !== slot) s.classList.remove('hover'); });
  if (slot) slot.classList.add('hover');
}
function slotUnder(x, y) {
  const list = document.querySelectorAll('#slots .slot');
  for (const s of list) {
    if (s.classList.contains('filled')) continue;
    const r = s.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return s;
  }
  return null;
}
function onDragEnd(e) {
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', onDragEnd);
  if (!drag) return;
  const d = drag; drag = null;
  const slot = slotUnder(e.clientX, e.clientY);
  document.querySelectorAll('.slot.hover').forEach(s => s.classList.remove('hover'));
  if (slot && !locked) {
    // Snap into the box
    const sr = slot.getBoundingClientRect();
    const emoji = d.candyEl.textContent;
    // Reserve the box now (so it can't be re-targeted) and remove the source candy
    slot.classList.add('filled');
    d.candyEl.remove();
    // Let the ghost glide into the box; reveal the candy when it lands
    d.ghost.style.transition = 'left 0.16s ease-out, top 0.16s ease-out';
    d.ghost.style.left = (sr.left + (sr.width - d.w) / 2) + 'px';
    d.ghost.style.top  = (sr.top + (sr.height - d.h) / 2) + 'px';
    setTimeout(() => { d.ghost.remove(); slot.textContent = emoji; }, 160);
    // Count out loud NOW, inside the finger gesture – otherwise iOS blocks the voice (silent outside a gesture)
    onCandyPlaced();
  } else {
    // Back to the pile
    const r = d.candyEl.getBoundingClientRect();
    d.ghost.style.transition = 'left 0.18s ease-out, top 0.18s ease-out';
    d.ghost.style.left = r.left + 'px';
    d.ghost.style.top  = r.top + 'px';
    setTimeout(() => { d.ghost.remove(); d.candyEl.classList.remove('grabbed'); }, 190);
  }
}

function onCandyPlaced() {
  eaten++;
  updateCounter();
  chompMouth();
  chompSound();
  // Count out loud for each candy – "one, two, three…" all the way to the total.
  sayNumber(eaten);
  if (eaten >= target) {
    locked = true;
    setTimeout(feedAll, 550);
  }
}

/* ── All candies fly from the boxes into the mouth ── */
function feedAll() {
  const filled = document.querySelectorAll('#slots .slot.filled');
  const br = $('bug').getBoundingClientRect();
  let n = 0;
  filled.forEach((s, i) => {
    const emoji = s.textContent;
    const sr = s.getBoundingClientRect();
    const f = document.createElement('div');
    f.className = 'candy dragging-ghost';
    f.textContent = emoji;
    f.style.position = 'fixed';
    f.style.margin = '0';
    f.style.width = sr.width + 'px';
    f.style.height = sr.height + 'px';
    f.style.left = sr.left + 'px';
    f.style.top = sr.top + 'px';
    f.style.display = 'flex';
    f.style.alignItems = 'center';
    f.style.justifyContent = 'center';
    document.body.appendChild(f);
    s.textContent = '';
    const dx = (br.left + br.width / 2) - (sr.left + sr.width / 2);
    const dy = (br.top  + br.height * 0.40) - (sr.top + sr.height / 2);
    setTimeout(() => {
      f.style.transition = 'transform 0.34s cubic-bezier(0.5,0,0.7,1), opacity 0.34s';
      f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(0.3)';
      f.style.opacity = '0';
      chompMouth(); chompSound();
    }, i * 90);
    setTimeout(() => f.remove(), i * 90 + 420);
    n++;
  });
  setTimeout(win, n * 90 + 380);
}

function win() {
  // Celebrate!
  const bug = $('bug');
  bug.classList.remove('cheer'); void bug.offsetWidth; bug.classList.add('cheer');

  stars++;
  $('hud-right').textContent = '⭐ ' + stars;

  dingSound();
  starPop();
  confettiBurst();

  // Say the result + praise. The plus level says the whole sum ("a plus b equals the sum"),
  // with a slightly longer delay so the last candy's count finishes first.
  // Say the result + praise. WAIT until the voice has finished before the next
  // round – the plus sentence is long and must not be cut off by a new number.
  const pi = Math.floor(Math.random() * PRAISE.length);
  const reachedEnd = stars >= ROUNDS_TO_END;
  let advanced = false;
  const finish = () => { if (advanced) return; advanced = true; if (reachedEnd) showEnding(); else nextRound(); };

  // Empty the candy pile and fade the boxes out nicely
  $('tray').innerHTML = '';
  $('slots').style.opacity = '0';

  let keys, tts, speakDelay, gapAfter;
  if (level === 3) {
    // Show the whole equation "2 + 3 = 5" as he celebrates – the child SEES the answer, not just hears it
    const num = $('number');
    num.textContent = addA + ' + ' + addB + ' = ' + target;
    num.classList.add('equation');
    num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');

    keys = [String(addA), 'plus', String(addB), 'lika', String(target), PRAISE_KEYS[pi]];
    tts  = NUM_EN[addA] + ' plus ' + NUM_EN[addB] + ' equals ' + NUM_EN[target] + '! ' + PRAISE[pi];
    speakDelay = 650; gapAfter = 450;
  } else {
    keys = [String(target), PRAISE_KEYS[pi]];
    tts  = NUM_EN[target] + '! ' + PRAISE[pi];
    speakDelay = 250; gapAfter = 400;
  }
  // The failsafe timer must NEVER be shorter than the sentence itself, or the
  // end ("…equals five! Good job!") gets cut off. Derive it from the clips'
  // real durations + a wide margin – it should only fire if speech truly hangs.
  const clipSecs = keys.reduce((s, k) => {
    const d = voiceEls[k] && isFinite(voiceEls[k].duration) ? voiceEls[k].duration : 1.2;
    return s + d;
  }, 0);
  const failsafe = speakDelay + Math.round(clipSecs * 1000) + (keys.length - 1) * CLIP_GAP * 1000 + gapAfter + 2000;
  setTimeout(() => sayClips(keys, tts, () => setTimeout(finish, gapAfter)), speakDelay);
  setTimeout(finish, failsafe); // safety if the speech never finishes
}

/* ── Ending: doctor animation plays in the scene, then "Play again" ── */
function showEnding() {
  locked = true;
  try { speechSynthesis.cancel(); } catch (e) {}
  stopVoice();
  if (window.bacillernaMusicPause) window.bacillernaMusicPause();
  show('screen-end');
  const v = $('end-video');
  // Show "Play again" + home RIGHT AWAY (no need to wait out the whole clip)
  $('end-buttons').classList.remove('hidden');
  try { v.currentTime = 0; } catch (e) {}
  v.muted = false;
  const p = v.play();
  if (p) p.catch(() => { v.muted = true; v.play().catch(() => {}); }); // silent fallback if audio blocked
}
function playAgain() {
  clearTimeout(endTimer);
  try { $('end-video').pause(); } catch (e) {}
  if (window.bacillernaMusicResume) window.bacillernaMusicResume();
  startGame(level);
}
function endToMenu() {
  clearTimeout(endTimer);
  try { $('end-video').pause(); } catch (e) {}
  if (window.bacillernaMusicResume) window.bacillernaMusicResume();
  show('screen-menu');
}

function starPop() {
  const s = $('star-pop');
  s.classList.remove('go'); void s.offsetWidth; s.classList.add('go');
}

function confettiBurst() {
  const arena = $('arena');
  const ar = arena.getBoundingClientRect();
  const cx = ar.width / 2;
  const cy = ar.height * 0.38;
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = pick(CONF_COLORS);
    c.style.left = (cx - 6) + 'px';
    c.style.top  = (cy - 8) + 'px';
    c.style.setProperty('--dx', ((Math.random() - 0.5) * 320).toFixed(0) + 'px');
    c.style.setProperty('--dy', (120 + Math.random() * 220).toFixed(0) + 'px');
    c.style.setProperty('--dur', (1.1 + Math.random() * 0.9).toFixed(2) + 's');
    arena.appendChild(c);
    setTimeout(() => c.classList.add('go'), Math.random() * 120);
    setTimeout(() => c.remove(), 2300);
  }
}

/* ── Menu ── */
function menuTap() {
  const b = $('menu-bug');
  b.classList.remove('chomp'); void b.offsetWidth; b.classList.add('chomp');
  chompSound();
}

function goMenu() {
  locked = true;
  try { speechSynthesis.cancel(); } catch (e) {}
  show('screen-menu');
}

/* ── Unlock & preload the voice clips on first tap ──
   iOS Safari won't preload/play <audio> without a user gesture. Without this
   the clips never reach readyState ≥ 2, clipReady() is always false and the
   counting gets stuck on the robot voice (TTS). A short silent play+pause in
   a gesture unlocks audio and forces preloading → Candy Bug's own voice. */
let voicesWarmed = false;
function warmVoices() {
  if (voicesWarmed) return;
  voicesWarmed = true;
  VOICE_KEYS.forEach(k => {
    const a = voiceEls[k];
    if (!a) return;
    // load() forces iOS to fetch metadata (readyState → 1) without needing play().
    // Muted + SYNCHRONOUS pause = silent even if iOS ignores the muted flag. An async
    // pause in .then() let all 15 clips play AUDIBLY at once on iPhone – a synchronous
    // pause stops the clip before it can be heard. muted=false after the pause is silent.
    try { a.load(); } catch (e) {}
    try {
      a.muted = true;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
      a.pause();
      a.currentTime = 0;
      a.muted = false;
    } catch (e) {}
  });
  // Also unlock the end video so its SOUND can play later (iOS needs a gesture).
  // ALSO a synchronous pause: an async pause in .then() could fire LATER – after
  // showEnding() had already started the doctor clip – and reset currentTime → the
  // video "froze" on the first frame. A synchronous pause never races playback.
  try {
    const v = $('end-video');
    if (v) {
      v.muted = true;
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
      v.pause();
      v.currentTime = 0;
      v.muted = false;
    }
  } catch (e) {}
}
['pointerdown', 'touchstart', 'click'].forEach(ev =>
  window.addEventListener(ev, warmVoices, { passive: true }));

show('screen-menu');
</script>
