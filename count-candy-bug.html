<style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

:root {
  --safe-top:    env(safe-area-inset-top,    0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left,   0px);

/* ── SHARED SCREEN CONTAINER ── */
.screen {
  position: fixed; inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left);

.screen.active { display: flex; }

/* ── START ── */
#screen-menu {
  justify-content: center;
  gap: clamp(10px, 2.6vmin, 20px);
  background: linear-gradient(160deg, #F1FBEA 0%, #C7EDA9 100%);

  padding-left: max(18px, var(--safe-left));
  padding-right: max(18px, var(--safe-right));
}
#menu-bug {
  width: clamp(150px, 34vmin, 230px);
  aspect-ratio: 1 / 1;
  object-fit: contain;
  animation: bob 2s ease-in-out infinite;
  cursor: pointer;
}
#menu-bug.chomp { animation: chompPop 0.45s ease-in-out; }
@keyframes chompPop {
  0%,100% { transform: scale(1) rotate(0); }
  35%     { transform: scale(1.12) rotate(-5deg); }
  65%     { transform: scale(1.07) rotate(5deg); }
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50%      { transform: translateY(-10px) rotate(3deg); }
}
#screen-menu h1 {
  font-size: clamp(26px, 7vmin, 50px);
  color: var(--green-deep);

}
#menu-sub {
  font-size: clamp(15px, 4vmin, 22px);

}
.levels { display: flex; flex-direction: column; gap: clamp(10px,2.4vmin,16px); margin-top: 6px; width: min(86vw, 340px); }
.big-btn {

  border: none;
  border-radius: 50px;

/* HUD */

/* Arena */

/* Dots (level 1) */

/* Candy Bug */
#bug-wrap {

}
@keyframes bugCheer {
  0%,100% { transform: translateY(0) scale(1) rotate(0); }
  35%     { transform: translateY(-26px) scale(1.1) rotate(-7deg); }
  65%     { transform: translateY(-8px) scale(1.06) rotate(7deg); }
}

/* Star pop on success */
#star-pop {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%);
  font-size: clamp(60px, 18vmin, 130px); pointer-events: none;
  display: none; z-index: 6; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
}
#star-pop.go { display: block; animation: starPop 1.2s ease-out forwards; }
@keyframes starPop {
  0%   { transform: translate(-50%,-50%) scale(0.2) rotate(-30deg); opacity: 0; }
  25%  { transform: translate(-50%,-50%) scale(1.15) rotate(8deg); opacity: 1; }
  70%  { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 1; }
  100% { transform: translate(-50%,-50%) scale(1.05) rotate(0); opacity: 0; }
}

/* Confetti on success */
.confetti {
  position: absolute; width: 12px; height: 16px; border-radius: 2px;

.confetti.go { animation: confFall var(--dur,1.4s) ease-in forwards; }
@keyframes confFall {

/* ── END SCREEN: doctor animation plays in the scene (not black fullscreen) ── */

<script>
/* ── Constants ── */
const ROUNDS_TO_END = 10;        // correct answers before the doctor animation
const CANDY_EMOJI = ['🍬','🍭','🍫','🧁','🍩','🍪'];
const NUM_EN = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen'];
const PRAISE = ['Good job!', 'Great!', 'Yes!'];  // fallback text, matches the praise clips
const CONF_COLORS = ['#7BC142','#FFCC4D','#FF8FB1','#5BC0F0','#C792EA','#FF8A65'];

/* ── Helpers ── */
const $ = id => document.getElementById(id);
function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

/* ── Sound ── */
const SFX = {
  wow:   new Audio('/ljud/wow.mp3'),
};
function playSfx(key, vol) {
  try { const a = SFX[key].cloneNode(); a.volume = vol == null ? 1 : vol; a.play().catch(()=>{}); } catch(e) {}
}

let audioCtx = null;
function ensureCtx() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// CHOMP – a short, soft "nom" synthesized in the browser (no sound file needed)
function chompSound() {
  try {
    const ctx = ensureCtx();
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(190, t);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.13);   // downward sweep = "nom"
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.20, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.18);
  } catch (e) {}
}
// Ding on reaching the number – a soft rising chime
function dingSound() {
  try {
    const ctx = ensureCtx();
    const t = ctx.currentTime;
    [{ f: 784, d: 0 }, { f: 1047, d: 0.10 }, { f: 1319, d: 0.20 }].forEach(n => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = n.f;
      const s = t + n.d;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.20, s + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.40);
      o.connect(g); g.connect(ctx.destination);
      o.start(s); o.stop(s + 0.45);
    });
  } catch (e) {}
}
// Count out loud in English (browser voice – used as fallback). Pick a clear
// English voice and avoid the robotic default; fall back to any en voice.
const VOICE_PREFS = ['Samantha', 'Karen', 'Moira', 'Tessa', 'Daniel', 'Shelley', 'Sandy'];
let _enVoice = null;
function pickEnVoice() {
  try {
    if (!('speechSynthesis' in window)) return null;
    const vs = speechSynthesis.getVoices() || [];
    for (const name of VOICE_PREFS) {
      const v = vs.find(v => v.name === name || v.name.startsWith(name + ' '));
      if (v) return v;
    }
    return vs.find(v => /^en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch (e) { return null; }
}
try { if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { _enVoice = pickEnVoice(); }; } catch (e) {}
function speak(text, pitch) {
  try {
    if (!('speechSynthesis' in window)) return;
    if (!_enVoice) _enVoice = pickEnVoice();
    const u = new SpeechSynthesisUtterance(text);
    if (_enVoice) u.voice = _enVoice;
    u.lang = (_enVoice && _enVoice.lang) || 'en-US';
    u.rate = 0.95; u.pitch = pitch == null ? 1.25 : pitch;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

/* ── Recorded Candy Bug voice (ElevenLabs) with TTS fallback ──
   Clips live in /ljud/rost/en/. If a clip is missing the browser voice is
   used automatically – the game works without the clips. */
const VOICE_DIR = '/ljud/rost/en/';
// Key → Leila's ElevenLabs filename.
const VOICE_FILES = {
  '1': 'One.mp3', '2': 'two.mp3', '3': 'three.mp3', '4': 'four.mp3', '5': 'five.mp3',
  '6': 'Six.mp3', '7': 'seven.mp3', '8': 'eight.mp3', '9': 'nine.mp3', '10': 'ten.mp3',
  'plus': 'plus.mp3', 'lika': 'equals.mp3',
  'berom1': 'Good_job_.mp3', 'berom2': 'Great_.mp3', 'berom3': 'Yes_.mp3'
};
const PRAISE_KEYS = ['berom1', 'berom2', 'berom3']; // same order as PRAISE
const VOICE_KEYS = Object.keys(VOICE_FILES);
const voiceEls = {};
VOICE_KEYS.forEach(k => {
  try { const a = new Audio(VOICE_DIR + VOICE_FILES[k]); a.preload = 'auto'; voiceEls[k] = a; } catch (e) {}
});
// A clip counts as ready if metadata has loaded (readyState >= 1) and no 404 error.
// iOS Safari only reaches readyState=1 after warmVoices; requiring >=2 caused iPad
// to always fall back to TTS.
function clipReady(k) {
  const a = voiceEls[k];
  return !!a && !a.error && a.readyState >= 1 && isFinite(a.duration) && a.duration > 0;
}
// Stop everything currently playing (clips + TTS) so nothing overlaps
let voiceActive = [];
function stopVoice() {
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  voiceActive.forEach(a => { try { a.pause(); } catch (e) {} });
  voiceActive = [];
}
// Play a sequence of clips back-to-back; interrupts anything already playing.
// Falls back to TTS if any clip is missing.
const CLIP_OVERLAP = 0.18;        // sec – start the next word before this one goes silent (tighter speech)
function sayClips(keys, ttsFallback, onDone) {
  stopVoice();
  if (!keys.every(clipReady)) {
    speak(ttsFallback);
    // Calculate TTS duration — 70ms per character + 800ms margin.
    // Prevents onDone firing mid-sentence (old 1600ms hardcode wasn't enough
    // for "three plus two equals five! Great!" which takes ~3–4 sec).
    if (onDone) setTimeout(onDone, Math.max(2500, ttsFallback.length * 70 + 800));
    return;
  }
  let i = 0;
  (function playNext() {
    if (i >= keys.length) { if (onDone) onDone(); return; }
    const key = keys[i++];
    const dur = voiceEls[key].duration || 0.6;
    let a;
    try { a = voiceEls[key].cloneNode(); } catch (e) { if (onDone) onDone(); return; }
    voiceActive.push(a);
    let stepped = false;
    const step = () => { if (stepped) return; stepped = true; playNext(); };
    // start the next clip slightly before this one ends → less silence between words
    const t = setTimeout(step, Math.max(120, (dur - CLIP_OVERLAP) * 1000));
    a.addEventListener('ended', () => { clearTimeout(t); step(); }, { once: true });
    a.addEventListener('error', () => { clearTimeout(t); step(); }, { once: true });
    const p = a.play(); if (p) p.catch(() => { clearTimeout(t); step(); });
  })();
}
// Say a single number (1–10)
function sayNumber(n) { sayClips([String(n)], NUM_EN[n] || String(n)); }

/* ── Chew pulse on the loop video for every feed ── */
function chompMouth() {
  const bug = $('bug');
  bug.classList.remove('chomp'); void bug.offsetWidth; bug.classList.add('chomp');
}

/* ── Game logic ── */
let level = 1;
let stars = 0;
let target = 0;
let eaten = 0;
let locked = false;
let addA = 0, addB = 0;          // the two numbers in the plus task (level 3)
let endTimer = null;             // failsafe timer for the end-screen buttons

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function startGame(lvl) {
  level = lvl;
  stars = 0;
  $('hud-right').textContent = '⭐ 0';
  $('hud-center').textContent = level === 3 ? 'Work it out and feed!' : 'Feed this many!';
  show('screen-game');
  nextRound();
}

function nextRound() {
  locked = false;
  eaten = 0;
  $('bug').classList.remove('cheer', 'chomp');

  // Decide the number
  let display, extra;
  if (level === 1) {
    target = randInt(1, 5);
    display = String(target);
    extra = 0;                       // exact amount – crystal clear for the youngest
  } else if (level === 2) {
    target = randInt(1, 10);
    display = String(target);
    extra = randInt(2, 3);           // a few extra candies in the pile
  } else {
    let a = randInt(1, 5), b = randInt(1, 5);
    while (a + b > 10) { a = randInt(1, 5); b = randInt(1, 5); }
    target = a + b;
    addA = a; addB = b;
    display = a + ' + ' + b;
    extra = 0;                       // exactly as many candies as the answer (4+4 → 8 candies)
  }

  // Number display
  const num = $('number');
  num.textContent = display;
  num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');

  // Dots (level 1 only)
  const dots = $('dots');
  if (level === 1) {
    dots.innerHTML = Array.from({ length: target }, () => '<div class="dot"></div>').join('');
  } else {
    dots.innerHTML = '';
  }

  // Counter
  $('counter-target').textContent = target;
  updateCounter();

  // Candies
  const box = $('candies');
  box.innerHTML = '';
  const makeCandy = () => {
    const b = document.createElement('button');
    b.className = 'candy';
    b.textContent = pick(CANDY_EMOJI);
    b.addEventListener('click', () => feed(b));
    return b;
  };
  if (level === 3) {
    // Two visible groups matching the numbers: addA candies «+» addB candies.
    // The child SEES the addition (4+4) – not just the total.
    const g1 = document.createElement('div'); g1.className = 'candy-group';
    for (let i = 0; i < addA; i++) g1.appendChild(makeCandy());
    const plus = document.createElement('div'); plus.className = 'candy-plus'; plus.textContent = '+';
    const g2 = document.createElement('div'); g2.className = 'candy-group';
    for (let i = 0; i < addB; i++) g2.appendChild(makeCandy());
    box.appendChild(g1); box.appendChild(plus); box.appendChild(g2);
  } else {
    const total = target + extra;
    for (let i = 0; i < total; i++) box.appendChild(makeCandy());
  }

}

function updateCounter() {
  $('counter-eaten').textContent = eaten;
}

function feed(el) {
  if (locked) return;
  eaten++;

  // Fly into the mouth
  flyToMouth(el);
  chompMouth();
  chompSound();
  updateCounter();

  // Dim a dot
  if (level === 1) {
    const d = $('dots').querySelectorAll('.dot:not(.eaten)')[0];
    if (d) d.classList.add('eaten');
  }

  // Count out loud for each candy. On the plus level the count restarts after
  // the first number: 2+3 → "one, two" (first number), then "one, two, three".
  const spokenNum = (level === 3 && eaten > addA) ? (eaten - addA) : eaten;
  sayNumber(spokenNum);

  if (eaten >= target) {
    locked = true;
    setTimeout(win, 450);
  }
}

function flyToMouth(el) {
  const box = $('candies');
  const br = $('bug').getBoundingClientRect();
  const cr = el.getBoundingClientRect();
  const pr = box.getBoundingClientRect();
  // Freeze the candy in place so the others don't jump
  el.style.position = 'absolute';
  el.style.left = (cr.left - pr.left) + 'px';
  el.style.top  = (cr.top  - pr.top)  + 'px';
  el.style.margin = '0';
  // Target: Candy Bug's mouth (a little above the image centre)
  const dx = (br.left + br.width / 2) - (cr.left + cr.width / 2);
  const dy = (br.top  + br.height * 0.40) - (cr.top + cr.height / 2);
  void el.offsetWidth;
  el.style.transition = 'transform 0.32s cubic-bezier(0.5,0,0.7,1), opacity 0.32s';
  el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(0.3)';
  el.style.opacity = '0';
  el.style.pointerEvents = 'none';
  setTimeout(() => el.remove(), 340);
}

function win() {
  // Celebrate!
  const bug = $('bug');
  bug.classList.remove('cheer'); void bug.offsetWidth; bug.classList.add('cheer');

  stars++;
  $('hud-right').textContent = '⭐ ' + stars;

  dingSound();
  starPop();
  confettiBurst();

  // Say the result + praise. The plus level says the whole sum ("a plus b equals the sum"),
  // with a slightly longer delay so the last candy's count finishes first.
  // Say the result + praise. WAIT until the voice has finished before the next
  // round – the plus sentence is long and must not be cut off by a new number.
  const pi = Math.floor(Math.random() * PRAISE.length);
  const reachedEnd = stars >= ROUNDS_TO_END;
  let advanced = false;
  const finish = () => { if (advanced) return; advanced = true; if (reachedEnd) showEnding(); else nextRound(); };

  // Clear remaining candies (and the plus level's empty groups/«+») nicely
  Array.from($('candies').children).forEach(c => {
    c.style.transition = 'transform 0.3s, opacity 0.3s';
    c.style.transform = 'scale(0.4)'; c.style.opacity = '0';
  });

  let keys, tts, speakDelay, gapAfter;
  if (level === 3) {
    keys = [String(addA), 'plus', String(addB), 'lika', String(target), PRAISE_KEYS[pi]];
    tts  = NUM_EN[addA] + ' plus ' + NUM_EN[addB] + ' equals ' + NUM_EN[target] + '! ' + PRAISE[pi];
    speakDelay = 650; gapAfter = 450;
  } else {
    keys = [String(target), PRAISE_KEYS[pi]];
    tts  = NUM_EN[target] + '! ' + PRAISE[pi];
    speakDelay = 250; gapAfter = 400;
  }
  // The failsafe timer must NEVER be shorter than the sentence itself, or the
  // end ("…equals five! Good job!") gets cut off. Derive it from the clips'
  // real durations + a wide margin – it should only fire if speech truly hangs.
  const clipSecs = keys.reduce((s, k) => {
    const d = voiceEls[k] && isFinite(voiceEls[k].duration) ? voiceEls[k].duration : 1.2;
    return s + d;
  }, 0);
  const failsafe = speakDelay + Math.round(clipSecs * 1000) + gapAfter + 2000;
  setTimeout(() => sayClips(keys, tts, () => setTimeout(finish, gapAfter)), speakDelay);
  setTimeout(finish, failsafe); // safety if the speech never finishes
}

/* ── Ending: doctor animation plays in the scene, then "Play again" ── */
function showEnding() {
  locked = true;
  try { speechSynthesis.cancel(); } catch (e) {}
  stopVoice();
  if (window.bacillernaMusicPause) window.bacillernaMusicPause();
  show('screen-end');
  const v = $('end-video');
  // Show "Play again" + home RIGHT AWAY (no need to wait out the whole clip)
  $('end-buttons').classList.remove('hidden');
  try { v.currentTime = 0; } catch (e) {}
  v.muted = false;
  const p = v.play();
  if (p) p.catch(() => { v.muted = true; v.play().catch(() => {}); }); // silent fallback if audio blocked
}
function playAgain() {
  clearTimeout(endTimer);
  try { $('end-video').pause(); } catch (e) {}
  if (window.bacillernaMusicResume) window.bacillernaMusicResume();
  startGame(level);
}
function endToMenu() {
  clearTimeout(endTimer);
  try { $('end-video').pause(); } catch (e) {}
  if (window.bacillernaMusicResume) window.bacillernaMusicResume();
  show('screen-menu');
}

function starPop() {
  const s = $('star-pop');
  s.classList.remove('go'); void s.offsetWidth; s.classList.add('go');
}

function confettiBurst() {
  const arena = $('arena');
  const ar = arena.getBoundingClientRect();
  const cx = ar.width / 2;
  const cy = ar.height * 0.38;
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = pick(CONF_COLORS);
    c.style.left = (cx - 6) + 'px';
    c.style.top  = (cy - 8) + 'px';
    c.style.setProperty('--dx', ((Math.random() - 0.5) * 320).toFixed(0) + 'px');
    c.style.setProperty('--dy', (120 + Math.random() * 220).toFixed(0) + 'px');
    c.style.setProperty('--dur', (1.1 + Math.random() * 0.9).toFixed(2) + 's');
    arena.appendChild(c);
    setTimeout(() => c.classList.add('go'), Math.random() * 120);
    setTimeout(() => c.remove(), 2300);
  }
}

/* ── Menu ── */
function menuTap() {
  const b = $('menu-bug');
  b.classList.remove('chomp'); void b.offsetWidth; b.classList.add('chomp');
  chompSound();
}

function goMenu() {
  locked = true;
  try { speechSynthesis.cancel(); } catch (e) {}
  show('screen-menu');
}

/* ── Unlock & preload the voice clips on first tap ──
   iOS Safari won't preload/play <audio> without a user gesture. Without this
   the clips never reach readyState ≥ 2, clipReady() is always false and the
   counting gets stuck on the robot voice (TTS). A short silent play+pause in
   a gesture unlocks audio and forces preloading → Candy Bug's own voice. */
let voicesWarmed = false;
function warmVoices() {
  if (voicesWarmed) return;
  voicesWarmed = true;
  VOICE_KEYS.forEach(k => {
    const a = voiceEls[k];
    if (!a) return;
    // load() forces iOS to fetch metadata (readyState → 1) without needing play().
    // play()+pause() then unlocks playback within the user gesture.
    try { a.load(); } catch (e) {}
    try {
      a.muted = true;
      const p = a.play();
      if (p && p.then) {
        p.then(() => { a.pause(); a.currentTime = 0; a.muted = false; })
         .catch(() => { a.muted = false; });
      } else {
        try { a.pause(); } catch (e) {}
        a.muted = false;
      }
    } catch (e) {}
  });
}
['pointerdown', 'touchstart', 'click'].forEach(ev =>
  window.addEventListener(ev, warmVoices, { passive: true }));

show('screen-menu');
</script>
