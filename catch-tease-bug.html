<!DOCTYPE html>
<html lang="en">
<head>
<script src="/back-to-app.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="/app/manifest.json">
<meta name="theme-color" content="#FFD700">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Catch Tease Bug – Kids Game | LuvBugs Collection</title>
<meta name="description" content="Tap Tease Bug before he runs away! A fun reaction game for kids. Choose easy, medium or hard.">
<link rel="canonical" href="https://luvbugscollection.com/catch-tease-bug.html" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }

:root {
  --safe-top:    env(safe-area-inset-top,    0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left,   0px);
  --safe-right:  env(safe-area-inset-right,  0px);
}

body {
  font-family: 'Fredoka', sans-serif;
  background: #FFF9C4;
  height: 100dvh;
  overflow: hidden;
  user-select: none;
}

.screen {
  position: fixed; inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
}
.screen.active { display: flex; }

/* ── MENU ── */
#screen-menu {
  justify-content: center;
  gap: clamp(12px, 3vmin, 22px);
  background: linear-gradient(160deg, #FFF9C4 0%, #FFE57A 100%);
}

#screen-menu h1 {
  font-size: clamp(24px, 6vmin, 48px);
  color: #C44D00;
  text-align: center;
}

#menu-bug {
  width: clamp(90px, 24vmin, 180px);
  animation: bob 2s ease-in-out infinite;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15));
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50%       { transform: translateY(-10px) rotate(3deg); }
}

.level-btn {
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(17px, 4.5vmin, 26px);
  font-weight: 600;
  border: none;
  border-radius: 50px;
  padding: clamp(11px,2.5vmin,16px) clamp(28px,6vmin,48px);
  width: clamp(190px, 55vw, 300px);
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
  box-shadow: 0 6px 0 rgba(0,0,0,0.15);
}
.level-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }

#btn-easy   { background: #7BC142; color: white; }
#btn-medium { background: #FFD700; color: #5A3A00; }
#btn-hard   { background: #E55A40; color: white; }

#menu-more-games {
  margin-top: 4px;
  font-size: clamp(14px, 3.5vmin, 18px);
  color: #C44D00;
  text-decoration: none;
  opacity: 0.75;
  padding: 8px 16px;
}
#menu-more-games:hover { opacity: 1; text-decoration: underline; }

/* ── GAME ── */
#screen-game {
  background: #FFF9C4;
  justify-content: flex-start;
}

#hud {
  width: 100%;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(255,215,0,0.4);
  backdrop-filter: blur(4px);
  min-height: 52px;
  flex-shrink: 0;
}

#hud-back {
  font-size: clamp(18px, 4.5vmin, 26px);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 8px;
  color: #C44D00;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  min-width: 44px; min-height: 44px;
  display: flex; align-items: center; justify-content: center;
}
#hud-back:active { background: rgba(0,0,0,0.08); }

#hud-center {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(18px, 4.5vmin, 26px);
  font-weight: 600;
  color: #C44D00;
  letter-spacing: 2px;
}

#hud-right {
  font-size: clamp(18px, 4.5vmin, 26px);
  font-weight: 600;
  color: #C44D00;
  text-align: right;
  min-width: 70px;
}

#arena {
  flex: 1;
  width: 100%;
  position: relative;
  overflow: hidden;
  background: #FFF9C4;
}

/* ── ENVIRONMENT per level ──
   Easy = plain yellow like today · Medium = forest (day) · Hard = forest (dusk) */
#screen-game[data-level="medium"] #arena {
  background: linear-gradient(180deg, #CDEBFB 0%, #E9F7DA 58%, #D2EEAE 100%);
}
#screen-game[data-level="hard"] #arena {
  background: linear-gradient(180deg, #34406B 0%, #6E5F97 52%, #C58A63 100%);
}

/* Forest scene – sits behind the bug, shown only on medium & hard */
#forest {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
  display: none;
}
#screen-game[data-level="medium"] #forest,
#screen-game[data-level="hard"]   #forest { display: block; }

/* Sun (day) / moon (dusk) */
.sun {
  position: absolute;
  top: 8%;
  right: 14%;
  width: clamp(50px, 14vmin, 110px);
  height: clamp(50px, 14vmin, 110px);
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #FFF6C0 0%, #FFE066 55%, rgba(255,224,102,0) 72%);
  animation: sunPulse 5s ease-in-out infinite;
}
@keyframes sunPulse {
  0%, 100% { transform: scale(1);    opacity: 0.9; }
  50%      { transform: scale(1.08); opacity: 1;   }
}
#screen-game[data-level="hard"] .sun {
  animation: none;
  background: radial-gradient(circle at 38% 38%, #FDFBF0 0%, #E7E3F4 60%, rgba(231,227,244,0) 74%);
}

/* Clouds */
.cloud {
  position: absolute;
  width: clamp(70px, 20vmin, 150px);
  height: clamp(24px, 6.5vmin, 48px);
  background: rgba(255,255,255,0.85);
  border-radius: 50px;
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
}
.cloud::before { width: 55%; height: 150%; top: -55%; left: 12%; }
.cloud::after  { width: 42%; height: 130%; top: -40%; right: 14%; }
.c1 { top: 13%; animation: drift 30s linear infinite; }
.c2 { top: 27%; --s: 0.72; opacity: 0.7;  animation: drift 40s linear infinite; animation-delay: -12s; }
.c3 { top: 6%;  --s: 0.55; opacity: 0.55; animation: drift 48s linear infinite; animation-delay: -24s; }
@keyframes drift {
  from { transform: translateX(-40vw) scale(var(--s, 1)); }
  to   { transform: translateX(160vw) scale(var(--s, 1)); }
}
#screen-game[data-level="hard"] .cloud,
#screen-game[data-level="hard"] .cloud::before,
#screen-game[data-level="hard"] .cloud::after { background: rgba(214,208,235,0.4); }

/* Distant treeline (silhouette) */
.treeline {
  position: absolute;
  left: 0; right: 0;
  bottom: 20%;
  height: clamp(50px, 15vmin, 120px);
  background: bottom center / auto 100% repeat-x
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='100' viewBox='0 0 120 100'><g fill='%2382B44E'><polygon points='22,8 4,92 40,92'/><polygon points='22,34 8,92 36,92'/><polygon points='60,0 40,92 80,92'/><polygon points='60,28 46,92 74,92'/><polygon points='98,14 78,92 118,92'/></g></svg>");
  opacity: 0.5;
}
#screen-game[data-level="hard"] .treeline { filter: brightness(0.4) saturate(0.7); opacity: 0.55; }

/* Forest floor */
.floor {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 22%;
  background: linear-gradient(180deg, #9BD45E 0%, #7CB944 42%, #6AA838 100%);
  box-shadow: inset 0 6px 0 rgba(255,255,255,0.18);
  border-radius: 42% 42% 0 0 / 14% 14% 0 0;
}
#screen-game[data-level="hard"] .floor {
  background: linear-gradient(180deg, #5E7A4A 0%, #47603A 45%, #38502F 100%);
}

/* Stars – dusk only (hard) */
.star {
  position: absolute;
  color: #FFFDF2;
  font-size: clamp(9px, 2.4vmin, 15px);
  opacity: 0;
}
#screen-game[data-level="hard"] .star { animation: twinkle 3s ease-in-out infinite; }
.st1 { top: 14%; left: 20%; animation-delay: 0s;   }
.st2 { top: 24%; left: 66%; animation-delay: 0.8s; }
.st3 { top: 9%;  left: 44%; animation-delay: 1.6s; }
.st4 { top: 30%; left: 84%; animation-delay: 2.2s; }
@keyframes twinkle {
  0%, 100% { transform: scale(0.6); opacity: 0.2;  }
  50%      { transform: scale(1.1); opacity: 0.95; }
}

/* Hiding spots (stump/spruce/stone/bush) – IN FRONT of the bug so it peeks out from behind */
#spots {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  display: none;
}
#screen-game[data-level="medium"] #spots,
#screen-game[data-level="hard"]   #spots { display: block; }
.spot {
  position: absolute;
  transform: translateX(-50%) scale(var(--sc, 1));
  transform-origin: bottom center;
  width: clamp(88px, 21vmin, 148px);
}
.spot .obj {
  display: block;
  width: 100%;
  height: auto;
  filter: drop-shadow(0 5px 5px rgba(0,0,0,0.18));
}
#screen-game[data-level="hard"] #spots { filter: brightness(0.72) saturate(0.9); }

/* Warm glow behind the bug when it pops */
#bug-glow {
  position: absolute;
  z-index: 2;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, rgba(255,224,102,0.7) 0%, rgba(255,224,102,0) 70%);
  pointer-events: none;
  display: none;
  transition: opacity 0.25s ease;
}

#bug {
  position: absolute;
  z-index: 3;
  width: clamp(80px, 20vmin, 150px);
  height: auto;
  cursor: pointer;
  display: none;
  transform-origin: center center;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
}
#bug.pop-in  { animation: popIn  0.28s cubic-bezier(0.34,1.56,0.64,1) forwards; }
#bug.pop-out { animation: popOut 0.22s ease-in forwards; }
#bug.peek-in  { animation: peekIn  0.32s cubic-bezier(0.34,1.45,0.6,1) forwards; }
#bug.peek-out { animation: peekOut 0.20s ease-in forwards; }

@keyframes popIn {
  from { transform: scale(0) rotate(-15deg); opacity: 0; }
  to   { transform: scale(1) rotate(0deg);   opacity: 1; }
}
@keyframes popOut {
  from { transform: scale(1); opacity: 1; }
  to   { transform: scale(0) rotate(15deg); opacity: 0; }
}
/* Peek out from behind the hiding spot (medium) */
@keyframes peekIn {
  from { transform: translateY(46%); opacity: 0; }
  to   { transform: translateY(0);   opacity: 1; }
}
@keyframes peekOut {
  from { transform: translateY(0);   opacity: 1; }
  to   { transform: translateY(46%); opacity: 0; }
}

#hit-text {
  position: absolute;
  z-index: 5;
  font-size: clamp(28px, 9vmin, 60px);
  font-weight: 700;
  color: #E55A40;
  pointer-events: none;
  display: none;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
}
@keyframes floatUp {
  from { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
  to   { transform: translateX(-50%) translateY(-50px) scale(1.3); opacity: 0; }
}

/* ── RESULT ── */
#screen-result {
  justify-content: center;
  gap: clamp(10px, 2.5vmin, 18px);
  background: linear-gradient(160deg, #FFF9C4 0%, #FFE57A 100%);
  text-align: center;
  padding-left: max(20px, var(--safe-left));
  padding-right: max(20px, var(--safe-right));
}

#result-emoji  { font-size: clamp(44px, 13vmin, 80px); }
#result-title  { font-size: clamp(22px, 6vmin, 40px); font-weight: 700; color: #C44D00; }
#result-label  { font-size: clamp(15px, 3.5vmin, 22px); color: #666; }
#result-score  { font-size: clamp(56px, 16vmin, 100px); font-weight: 700; color: #E55A40; line-height: 1; }
#result-unit   { font-size: clamp(15px, 3.5vmin, 22px); color: #666; }

.result-btn {
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(15px, 4vmin, 22px);
  font-weight: 600;
  border: none;
  border-radius: 50px;
  padding: clamp(10px,2.5vmin,14px) clamp(24px,5vmin,40px);
  width: clamp(200px, 60vw, 300px);
  cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,0.15);
  transition: transform 0.1s, box-shadow 0.1s;
}
.result-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }

#btn-replay     { background: #FFD700; color: #5A3A00; }
#btn-next-level { background: #E55A40; color: white; }
#btn-back-menu  { background: white; color: #888; border: 1px solid #ddd; box-shadow: none; }
</style>
</head>
<body>

<!-- ── MENU ── -->
<div id="screen-menu" class="screen">
  <img id="menu-bug" src="/bilder/retbacillen.png" alt="Tease Bug">
  <h1>Catch Tease Bug!</h1>
  <button class="level-btn" id="btn-easy"   onclick="startGame('easy')">😊 Easy</button>
  <button class="level-btn" id="btn-medium" onclick="startGame('medium')">😏 Medium</button>
  <button class="level-btn" id="btn-hard"   onclick="startGame('hard')">😤 Hard</button>
  <a href="/app/games.html" id="menu-more-games">🎮 More games</a>
</div>

<!-- ── GAME ── -->
<div id="screen-game" class="screen">
  <div id="hud">
    <button id="hud-back" onclick="goMenu()">←</button>
    <div id="hud-center"></div>
    <div id="hud-right"></div>
  </div>
  <div id="arena">
    <div id="forest" aria-hidden="true">
      <div class="sun"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <span class="star st1">✦</span>
      <span class="star st2">✦</span>
      <span class="star st3">✦</span>
      <span class="star st4">✦</span>
      <div class="treeline"></div>
      <div class="floor"></div>
    </div>
    <div id="spots"></div>
    <div id="bug-glow"></div>
    <img id="bug" src="/bilder/retbacillen.png" alt="" onclick="catchBug()">

</div>

<!-- ── RESULT ── -->
<div id="screen-result" class="screen">
  <div id="result-emoji">🏆</div>
  <div id="result-title"></div>
  <div id="result-label">You caught</div>

  <div id="result-unit">Tease Bugs!</div>
  <button class="result-btn" id="btn-replay"     onclick="replayGame()">🔄 Play again</button>
  <button class="result-btn" id="btn-next-level" onclick="goNextLevel()"></button>
  <button class="result-btn" id="btn-back-menu"  onclick="goMenu()">← Choose level</button>
</div>

<script>
const LEVELS = {
  //  env: null = free pop (like today) · 'peek' = peek from behind a hiding spot · 'move' = chase
  easy:   { showTime: 3400, missDelay: 900, lives: Infinity, countdown: 0,  env: null   },
  medium: { showTime: 1900, missDelay: 650, lives: 3,        countdown: 0,  env: 'peek' },
  hard:   { showTime: 2800, missDelay: 550, lives: Infinity, countdown: 60, env: 'move' },
};
const NEXT_LEVEL = { easy: 'medium', medium: 'hard', hard: null };
const NEXT_LABEL = { easy: '😏 Try Medium!', medium: '😤 Try Hard!', hard: null };

let level, score, lives, timeLeft, active;
let bugTimer, countdownInterval, nextTimer;
let currentLevel = 'easy';

const $ = id => document.getElementById(id);

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

const SFX = {
  nanana: new Audio('/ljud/nanana.mp3'),
  catchme: new Audio('/ljud/catch-me-if-you-can.mp3'),
  aj:     new Audio('/ljud/aj.mp3'),
  skratt: new Audio('/ljud/skratt.mp3'),
};

// Taunt sounds alternated when the Tease Bug appears: "na-na-na" → "Catch me if you can!" → …
const TAUNTS = ['nanana', 'catchme'];
let tauntIdx = 0;
function playTaunt() {
  const key = TAUNTS[tauntIdx % TAUNTS.length];
  tauntIdx++;
  speak(key);
}
function stopTaunts() { TAUNTS.forEach(stopSfx); }
function speak(key) {
  const sfx = SFX[key];
  if (!sfx) return;
  sfx.currentTime = 0;
  sfx.play().catch(() => {});
}
function stopSfx(key) {
  const sfx = SFX[key];
  if (!sfx) return;
  try { sfx.pause(); sfx.currentTime = 0; } catch (e) {}
}

// Short buzzing "vibration sound" for the wrong bug – made in the browser (no audio file).
// Two low buzzes matching the physical vibration [80, 60, 80].
let buzzCtx = null;
function playBuzz() {
  try {
    buzzCtx = buzzCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (buzzCtx.state === 'suspended') buzzCtx.resume();
    const now = buzzCtx.currentTime;
    const buzz = (start, dur) => {
      const osc = buzzCtx.createOscillator();
      const gain = buzzCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = 120;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain).connect(buzzCtx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.02);
    };
    buzz(now, 0.08);
    buzz(now + 0.14, 0.08);
  } catch (e) {}
}

// Mobile (especially iOS) requires each sound to be played inside a user tap
// at least once, otherwise playback from timers (e.g. the laugh) is blocked.
// Unlock all sounds on the first tap by playing them silently.
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  Object.values(SFX).forEach(sfx => {
    sfx.muted = true;
    sfx.play().then(() => {
      sfx.pause();
      sfx.currentTime = 0;
      sfx.muted = false;
    }).catch(() => { sfx.muted = false; });
  });
}

const DISTRACTORS = [
  '/bilder/godisbacillen.png',
  '/bilder/karleksbacillen.png',
  '/bilder/dansbacillen.png',
  '/bilder/gladjebacillen.png',
  '/bilder/rikedomsbacillen.png',
  '/bilder/Partyhatt.png',
  '/bilder/Bananglasögonen_ska_användas_om_accessoar_202605222149.png',
  '/bilder/eggglasogon.png',
];
const REAL_CHANCE = 0.35;
let isRealBug = true;

// ── FOREST: hiding spots (pure SVG, no image files) ──
const OBJ_SVG = {
  stump: `<svg class="obj" viewBox="0 0 100 88" xmlns="http://www.w3.org/2000/svg">
    <path d="M24 28 h52 v38 q0 12 -26 12 q-26 0 -26 -12 z" fill="#7A4A24"/>
    <ellipse cx="50" cy="28" rx="26" ry="9" fill="#A66B33"/>
    <ellipse cx="50" cy="28" rx="16" ry="5" fill="#8A5528"/>
    <ellipse cx="50" cy="28" rx="7"  ry="2.2" fill="#A66B33"/>
    <path d="M31 44 q6 4 0 8 M69 46 q-6 4 0 8" stroke="#5E3A1C" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </svg>`,
  spruce: `<svg class="obj" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    <rect x="44" y="96" width="12" height="20" rx="3" fill="#7A4A24"/>
    <polygon points="50,6 20,52 80,52"  fill="#3E8E4A"/>
    <polygon points="50,30 14,80 86,80" fill="#348040"/>
    <polygon points="50,56 10,104 90,104" fill="#2C7137"/>
  </svg>`,
  stone: `<svg class="obj" viewBox="0 0 100 66" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 60 q-4 -30 26 -40 q30 -10 46 8 q16 16 6 32 z" fill="#9AA3AA"/>
    <path d="M22 38 q10 -12 26 -12" stroke="#C3CAD0" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>`,
  bush: `<svg class="obj" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="40" r="22" fill="#3E9E4E"/>
    <circle cx="64" cy="36" r="26" fill="#379145"/>
    <circle cx="48" cy="50" r="22" fill="#31843E"/>
    <circle cx="78" cy="50" r="15" fill="#3E9E4E"/>
    <rect x="8" y="56" width="86" height="13" rx="6.5" fill="#2C7137"/>
  </svg>`,
};
// x = center in % of the arena, bottom = % from the floor, sc = depth scale
const SPOTS = [
  { type: 'stump',  x: 16, bottom: 7,  sc: 1.05 },
  { type: 'bush',   x: 45, bottom: 4,  sc: 1.1  },
  { type: 'stone',  x: 76, bottom: 8,  sc: 0.95 },
  { type: 'spruce', x: 28, bottom: 19, sc: 0.8  },
  { type: 'bush',   x: 63, bottom: 22, sc: 0.72 },
  { type: 'spruce', x: 86, bottom: 16, sc: 0.85 },
];
function buildForest() {
  const c = $('spots');
  if (!c) return;
  c.innerHTML = SPOTS.map(s =>
    `<div class="spot" style="left:${s.x}%;bottom:${s.bottom}%;--sc:${s.sc}">${OBJ_SVG[s.type]}</div>`
  ).join('');
}
buildForest();

function updateHud() {
  $('hud-right').textContent = '⭐ ' + score;
  if (lives !== Infinity) {
    $('hud-center').textContent = '❤️'.repeat(Math.max(0, lives));
  } else if (level.countdown) {
    $('hud-center').textContent = '⏱ ' + timeLeft + 's';
  } else {
    $('hud-center').textContent = '';
  }
}

function startGame(lvlKey) {
  unlockAudio();
  currentLevel = lvlKey;
  level  = LEVELS[lvlKey];
  score  = 0;
  lives  = level.lives;
  timeLeft = level.countdown;
  active = true;
  $('screen-game').dataset.level = lvlKey;
  show('screen-game');
  updateHud();

  if (level.countdown) {
    countdownInterval = setInterval(() => {
      timeLeft--;
      updateHud();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  scheduleBug();
}

function scheduleBug() {
  if (!active) return;
  nextTimer = setTimeout(showBug, level.missDelay);
}

function showBug() {
  if (!active) return;
  stopTaunts();   // cut any leftover taunt so it isn't heard on the next figure
  const bug = $('bug');

  isRealBug = Math.random() < REAL_CHANCE;
  bug.src = isRealBug
    ? '/bilder/retbacillen.png'
    : DISTRACTORS[Math.floor(Math.random() * DISTRACTORS.length)];
  bug.style.display = 'block';

  if (level.env === 'peek') {
    // Medium: peek out from behind a random hiding spot
    bug.style.zIndex = '3';
    placeBugAtSpot();
    bug.className = 'peek-in';
    positionGlow();
  } else if (level.env === 'move') {
    // Hard: zoom diagonally or in a circle – chase it!
    bug.style.zIndex = '6';   // in front of the forest hiding spots
    bug.style.width  = '';
    hideGlow();
    startBugMotion();
  } else {
    // Easy: free pop, exactly like today
    bug.style.zIndex = '3';
    bug.style.width  = '';
    const arena = $('arena');
    const bw = bug.offsetWidth  || 120;
    const bh = bug.offsetHeight || 120;
    const aw = arena.offsetWidth;
    const ah = arena.offsetHeight;
    const margin = 20;
    bug.style.left = (margin + Math.random() * Math.max(0, aw - bw - margin * 2)) + 'px';
    bug.style.top  = (margin + Math.random() * Math.max(0, ah - bh - margin * 2)) + 'px';
    bug.className = 'pop-in';
    positionGlow();
  }

  if (isRealBug) playTaunt();
  bugTimer = setTimeout(missedBug, level.showTime);
}

// Place the bug so it peeks out from behind a hiding spot (medium)
function placeBugAtSpot() {
  const bug   = $('bug');
  const arena = $('arena');
  const spots = document.querySelectorAll('#spots .spot');
  if (!spots.length) return;
  const obj = spots[Math.floor(Math.random() * spots.length)].querySelector('.obj');
  const aR  = arena.getBoundingClientRect();
  const oR  = obj.getBoundingClientRect();
  const bugW = oR.width * 0.82;
  bug.style.width = bugW + 'px';
  const bugH = bug.offsetHeight || bugW;
  const objCx = oR.left + oR.width / 2 - aR.left;
  const objTop = oR.top - aR.top;
  bug.style.left = (objCx - bugW / 2) + 'px';
  // the bug's lower part overlaps the hiding spot's top ~28% → looks like it's hiding
  bug.style.top  = (objTop + oR.height * 0.28 - bugH) + 'px';
}

// ── CHASE mode (hard): diagonal bounce or circular path ──
let motionRAF = null;
function startBugMotion() {
  const bug   = $('bug');
  const arena = $('arena');
  const aw = arena.offsetWidth, ah = arena.offsetHeight;
  const bw = bug.offsetWidth  || 110, bh = bug.offsetHeight || 110;
  bug.className = 'pop-in';

  const circular = Math.random() < 0.5;
  let last = null;

  if (circular) {
    const cx = aw / 2 - bw / 2, cy = ah / 2 - bh / 2;
    const rx = Math.min(aw, ah) * 0.30, ry = Math.min(aw, ah) * 0.26;
    let ang = Math.random() * Math.PI * 2;
    const w = 0.00378 * (Math.random() < 0.5 ? 1 : -1);   // rad/ms (~1.5s per lap) – 10% slower
    const step = t => {
      if (!active) return;
      if (last === null) last = t;
      ang += w * (t - last); last = t;
      bug.style.left = (cx + Math.cos(ang) * rx) + 'px';
      bug.style.top  = (cy + Math.sin(ang) * ry) + 'px';
      motionRAF = requestAnimationFrame(step);
    };
    motionRAF = requestAnimationFrame(step);
  } else {
    let x = Math.random() * (aw - bw), y = Math.random() * (ah - bh);
    const speed = Math.max(aw, ah) * 0.000558;            // px/ms – 10% slower
    const ang = Math.random() * Math.PI * 2;
    let vx = Math.cos(ang) * speed, vy = Math.sin(ang) * speed;
    bug.style.left = x + 'px'; bug.style.top = y + 'px';
    const step = t => {
      if (!active) return;
      if (last === null) last = t;
      const dt = t - last; last = t;
      x += vx * dt; y += vy * dt;
      if (x <= 0)        { x = 0;        vx =  Math.abs(vx); }
      if (x >= aw - bw)  { x = aw - bw;  vx = -Math.abs(vx); }
      if (y <= 0)        { y = 0;        vy =  Math.abs(vy); }
      if (y >= ah - bh)  { y = ah - bh;  vy = -Math.abs(vy); }
      bug.style.left = x + 'px'; bug.style.top = y + 'px';
      motionRAF = requestAnimationFrame(step);
    };
    motionRAF = requestAnimationFrame(step);
  }
}
function stopBugMotion() {
  if (motionRAF) { cancelAnimationFrame(motionRAF); motionRAF = null; }
}

// Glow behind the bug
function positionGlow() {
  const glow = $('bug-glow'), bug = $('bug'), arena = $('arena');
  const aR = arena.getBoundingClientRect();
  const bR = bug.getBoundingClientRect();
  if (!bR.width) return;
  const w = bR.width * 1.6, h = bR.height * 1.6;
  glow.style.width  = w + 'px';
  glow.style.height = h + 'px';
  glow.style.left = (bR.left - aR.left + bR.width  / 2 - w / 2) + 'px';
  glow.style.top  = (bR.top  - aR.top  + bR.height / 2 - h / 2) + 'px';
  glow.style.display = 'block';
  glow.style.opacity = '1';
}
function hideGlow() {
  const glow = $('bug-glow');
  glow.style.opacity = '0';
  setTimeout(() => { glow.style.display = 'none'; }, 220);
}

function catchBug() {
  if (!active) return;
  clearTimeout(bugTimer);
  if (isRealBug) {
    score++;
    stopTaunts();
    speak('aj');
    showHitText('Got ya! 😤', '#E55A40');
    updateHud();
  } else {
    navigator.vibrate?.([80, 60, 80]);
    playBuzz();
  }
  hideBug(() => scheduleBug());
}

function missedBug() {
  if (!active) return;
  if (isRealBug) {
    stopTaunts();
    speak('skratt');
    hideBug(() => {
      if (lives !== Infinity) {
        lives--;
        updateHud();
        if (lives <= 0) { endGame(); return; }
      }
      scheduleBug();
    });
  } else {
    hideBug(() => scheduleBug());
  }
}

function hideBug(cb) {
  stopBugMotion();
  hideGlow();
  const bug = $('bug');
  bug.className = (level && level.env === 'peek') ? 'peek-out' : 'pop-out';
  setTimeout(() => {
    bug.style.display = 'none';
    bug.className = '';
    bug.style.zIndex = '';
    if (cb) cb();
  }, 220);
}

function showHitText(text, color) {
  const bug   = $('bug');
  const hit   = $('hit-text');
  const arena = $('arena');
  const aR = arena.getBoundingClientRect();
  const bR = bug.getBoundingClientRect();
  hit.textContent = text || 'Got ya!';
  hit.style.color = color || '#E55A40';
  hit.style.left = (bR.left - aR.left + bR.width / 2) + 'px';
  hit.style.top  = (bR.top  - aR.top  - 6) + 'px';
  hit.style.display = 'block';
  hit.style.animation = 'none';
  void hit.offsetWidth;
  hit.style.animation = 'floatUp 0.6s ease-out forwards';
  setTimeout(() => { hit.style.display = 'none'; }, 600);
}

function stopGame() {
  active = false;
  stopBugMotion();
  clearTimeout(bugTimer);
  clearTimeout(nextTimer);
  clearInterval(countdownInterval);
  hideGlow();
  $('bug').style.display = 'none';
}

function endGame() {
  stopGame();
  $('result-emoji').textContent = score >= 15 ? '🏆' : score >= 8 ? '⭐' : '😅';
  $('result-title').textContent = currentLevel === 'hard' ? 'Time\'s up!' : 'Game over!';
  $('result-score').textContent = score;

  const nextLvl = NEXT_LEVEL[currentLevel];
  const nextBtn = $('btn-next-level');
  if (nextLvl) {
    nextBtn.textContent = NEXT_LABEL[currentLevel];
    nextBtn.style.display = '';
  } else {
    nextBtn.style.display = 'none';
  }

  setTimeout(() => show('screen-result'), 400);
}

function replayGame()   { startGame(currentLevel); }
function goNextLevel()  { startGame(NEXT_LEVEL[currentLevel]); }
function goMenu() {
  stopGame();
  show('screen-menu');
}

show('screen-menu');
</script>
<script src="bg-musik.js" data-track="ljud/musik-retbacillen.mp3" data-volume="0.15" data-pos="bottom-left-up" data-label="Music on or off"></script>
